<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#06060a">
<title>Lully Blanket Preview</title>
<style>
*{box-sizing:border-box;min-width:0}
html,body{margin:0;height:100%;background:#06060a;color:#fff;font:16px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif}
body{display:flex;flex-direction:column;height:100dvh;height:100vh;overflow:hidden;
  padding:calc(env(safe-area-inset-top) + 10px) 14px calc(env(safe-area-inset-bottom) + 10px)}
@supports(height:100dvh){body{height:100dvh}}
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
.top small{display:block;font-size:13px;opacity:.65}
#scene{font-size:clamp(26px,7vw,40px);font-weight:700;line-height:1.05}
#hit{font-size:14px;padding:5px 10px;border-radius:999px;background:rgba(255,255,255,.1);opacity:0;transition:opacity .4s;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:55%}
#hit.on{opacity:1}
#layers{font-size:14px;opacity:.85;min-height:1.2em;margin-top:2px}
#stage{flex:1;position:relative;min-height:200px}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block}
.bottom{display:flex;flex-direction:column;gap:8px}
#text{background:rgba(255,255,255,.07);border-radius:12px;padding:8px 12px;font-size:15px;height:3.3em;overflow:hidden;display:flex;flex-direction:column;justify-content:flex-end}
#text .i{opacity:.55}
#status,#ai{font-size:12.5px;opacity:.8;min-height:1.1em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row{display:flex;gap:8px;flex-wrap:wrap}
button{font-family:inherit;font-weight:600;font-size:15px;min-height:44px;padding:0 14px;border-radius:12px;border:0;color:#111;background:#fff;cursor:pointer}
button.ghost{background:rgba(255,255,255,.14);color:#fff}
button.chip{font-size:13px;min-height:40px;padding:0 11px}
button.stop{background:#ff5a5f;color:#fff}
button:focus-visible,input:focus-visible{outline:3px solid #ffd54a;outline-offset:2px}
form{display:flex;gap:8px;flex:1 1 200px}
input{flex:1;font-family:inherit;font-size:16px;min-height:44px;padding:0 12px;border-radius:12px;border:0;background:rgba(255,255,255,.9);color:#111}
body.full{padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);background:#000}
body.full .top,body.full .bottom{display:none}
#stage{cursor:pointer;-webkit-tap-highlight-color:transparent}
#fullhint{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);font-size:13px;padding:6px 12px;border-radius:999px;background:rgba(0,0,0,.45);color:#fff;opacity:0;transition:opacity .6s;pointer-events:none;white-space:nowrap}
#fullhint.on{opacity:.85}
#warn{display:none;background:rgba(255,90,95,.18);padding:10px 12px;border-radius:10px;font-size:14px}
</style>
</head>
<body>
<div class="top">
  <div><small>Lully blanket preview v27 · 4 × 5 ft · 320 LEDs</small><div id="scene">Ready</div><div id="layers"></div></div>
  <div id="hit"></div>
</div>
<div id="stage"><canvas id="cv"></canvas><div id="fullhint"></div></div>
<div class="bottom">
  <div id="warn"></div>
  <div id="text"><span class="i">Tap Start and read a story aloud, or try a demo.</span></div>
  <div id="status"></div>
  <div id="ai"></div>
  <div class="row">
    <button id="go">Start listening</button>
    <button id="demo" class="ghost">Demo</button>
    <button id="aidemo" class="ghost">AI demo</button>
  </div>
  <div class="row">
    <button id="fxmode" class="ghost chip" style="display:none">Effects: off</button>
    <button id="scenesys" class="ghost chip">Scenes: AI recipes</button>
    <button id="react" class="ghost chip">Reactivity</button>
    <button id="brain" class="ghost chip">Scenes</button>
    <button id="model" class="ghost chip">Model</button>
    <button id="eng" class="ghost chip">Engine</button>
    <button id="diff" class="ghost chip">Diffusion: plush</button>
    <button id="leds" class="ghost chip">Show LEDs</button>
    <button id="room" class="ghost chip">Room: bedtime lamp</button>
    <button id="cloud" class="ghost chip">Cloud AI: off</button>
    <button id="style" class="ghost chip">Style: soft glow</button>
  </div>
  <div class="row"><form id="typed"><input id="line" placeholder="Or type a line" autocomplete="off"><button class="ghost">Go</button></form></div>
</div>

  rain:'rain raining rainy drizzle raindrops downpour puddles',
  snowfall:'snowing snowfall blizzard snowflakes',
  wind:'wind windy gust gusts breeze howl howled howling',
  fog:'fog foggy mist misty haze',
  fireflies:'firefly fireflies',
  fireworks:'fireworks firework',

  rainbow:'rainbow',

const LEX={};for(const k in WORDS)for(const w of WORDS[k].split(' '))LEX[w]=k;
const LSTRENGTH={storm:.55,rain:.7,snowfall:1,wind:.7,fog:1,fireflies:1,fireworks:1,aurora:1,rainbow:1,magic:.55};
const LLEX={};for(const k in LWORDS)for(const w of LWORDS[k].split(' '))LLEX[w]=k;
const FX={thunder:'thunder',lightning:'thunder',boom:'flash',crash:'flash',bang:'flash',kaboom:'flash',zap:'flash',
  roar:'roar',roared:'roar',splash:'splash',splashed:'splash',sparkle:'sparkle',sparkled:'sparkle',twinkle:'sparkle',poof:'sparkle',shimmer:'sparkle'};
const MOOD={tense:'scary afraid fear frightened monster monsters ghost shadow shadows creep creepy spooky growl growled haunted trembled',
  lively:'happy laugh laughed laughing giggle giggled dance danced dancing party cheer cheered hooray played'};
const MOODLEX={};for(const k in MOOD)for(const w of MOOD[k].split(' '))MOODLEX[w]=k;
const TIMEW=new Set(['moonlight','moonlit','midnight','nighttime','daytime','daylight','dawn','sunrise','sunset','starry','underwater']);
const TRANS=new Set(['went inside','came inside','stepped inside','ran inside','went outside','stepped outside','ran outside','went home','back home','arrived at','dove into','flew to','sailed to','woke up','next morning','that night','climbed into','walked into','back inside','inside to','came home','got home']);
const PAIRS={'northern lights':['L','aurora'],'lightning bugs':['L','fireflies']};
const STOPS={'storm passed':['storm','rain','wind'],'storm ended':['storm','rain','wind'],'rain stopped':['rain','storm'],'sun came':['storm','rain','fog'],
  'clouds cleared':['storm','rain','fog'],'skies cleared':['storm','rain','fog'],'wind died':['wind'],'fog lifted':['fog'],'snow stopped':['snowfall'],'stopped snowing':['snowfall']};

// ---------- Blanket renderer: 4 ft x 5 ft, 16 x 20 = 320 LEDs on a 3-inch grid ----------
const COLS=16,ROWS=20,N=COLS*ROWS;
let cv=document.getElementById('cv'),ctx=cv.getContext('2d');
// Safari can drop a canvas's drawing memory under pressure; if that happens, swap in a fresh canvas and carry on
function freshCanvas(){const n=document.createElement('canvas');n.id='cv';cv.replaceWith(n);cv=n;ctx=cv.getContext('2d');lastLayout='';layout()}
cv.addEventListener('contextlost',()=>setTimeout(freshCanvas,50));
const A=document.createElement('canvas');A.width=COLS;A.height=ROWS;const actx=A.getContext('2d');const aImg=actx.createImageData(COLS,ROWS);
const S=4,Bc=document.createElement('canvas');Bc.width=COLS*S;Bc.height=ROWS*S;const bctx=Bc.getContext('2d');const bImg=bctx.createImageData(COLS*S,ROWS*S);
const Mc=document.createElement('canvas');Mc.width=COLS*8;Mc.height=ROWS*8;const mctx=Mc.getContext('2d');
let W=0,H=0,dpr=1,bx=0,by=0,bw=0,bh=0,fabric=null;
function rr(c,x,y,w,h,r){c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath()}
const FAB_CV=document.createElement('canvas'),NZ_CV=document.createElement('canvas');
function makeFabric(w,h){
  // White plush/minky top layer: soft fur grain, faint stitched quilting, a gentle sheen. Drawn over the light.
  const f=FAB_CV;f.width=Math.max(1,w);f.height=Math.max(1,h);const c=f.getContext('2d');c.clearRect(0,0,f.width,f.height);
  const nw=Math.max(1,w>>1),nh=Math.max(1,h>>1),nz=NZ_CV;nz.width=nw;nz.height=nh;
  const nc=nz.getContext('2d'),id=nc.createImageData(nw,nh),d=id.data;
  for(let i=0;i<d.length;i+=4){const n=Math.random();if(n<.5){d[i]=d[i+1]=d[i+2]=0;d[i+3]=n*26}else{d[i]=d[i+1]=d[i+2]=255;d[i+3]=(n-.5)*30}}
  nc.putImageData(id,0,0);c.imageSmoothingEnabled=true;c.drawImage(nz,0,0,w,h);
  const step=w/6;c.lineWidth=Math.max(1.5,w/180);
  for(let pass=0;pass<2;pass++){c.strokeStyle=pass?'rgba(255,255,255,.10)':'rgba(60,55,50,.16)';const o=pass?c.lineWidth*1.1:0;c.beginPath();
    for(let x=-h;x<w+h;x+=step){c.moveTo(x+o,0);c.lineTo(x+h+o,h);c.moveTo(x+o,h);c.lineTo(x+h+o,0)}c.stroke()}
  const g=c.createLinearGradient(0,0,w,h);g.addColorStop(0,'rgba(255,255,255,.06)');g.addColorStop(.5,'rgba(255,255,255,0)');g.addColorStop(1,'rgba(0,0,0,.05)');c.fillStyle=g;c.fillRect(0,0,w,h);
  c.strokeStyle='rgba(0,0,0,.18)';c.lineWidth=Math.max(2,w/120);rr(c,c.lineWidth/2,c.lineWidth/2,w-c.lineWidth,h-c.lineWidth,18*(w/Math.max(1,bw)));c.stroke();
  nz.width=1;nz.height=1;

}
let lastLayout='';
function layout(){
  const r=cv.parentElement.getBoundingClientRect();dpr=Math.min(2,window.devicePixelRatio||1);
  const key=Math.round(r.width)+'x'+Math.round(r.height)+'@'+dpr+document.body.classList.contains('full');if(key===lastLayout)return;lastLayout=key;W=r.width;H=r.height;
  cv.width=Math.max(1,W*dpr);cv.height=Math.max(1,H*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);
  const pad=document.body.classList.contains('full')?6:16,ar=48/60;let h=H-pad*2,w=h*ar;if(w>W-pad*2){w=W-pad*2;h=w/ar}
  bw=Math.max(10,w);bh=Math.max(10,h);bx=(W-bw)/2;by=(H-bh)/2;fabric=makeFabric(Math.round(bw*dpr),Math.round(bh*dpr));
}
let layoutT=0;const layoutSoon=()=>{clearTimeout(layoutT);layoutT=setTimeout(layout,150)};
new ResizeObserver(layoutSoon).observe(cv.parentElement);layout();
// tap the blanket for a full-screen view with all controls hidden; tap again to come back
(function(){
  const st=document.getElementById('stage'),hint=document.getElementById('fullhint');let ht=0;
  function showHint(t){hint.textContent=t;hint.classList.add('on');clearTimeout(ht);ht=setTimeout(()=>hint.classList.remove('on'),2200)}
  function setFull(on){
    document.body.classList.toggle('full',on);
    const d=document,el=d.documentElement;
    try{if(on&&!d.fullscreenElement&&!d.webkitFullscreenElement){(el.requestFullscreen||el.webkitRequestFullscreen||function(){}).call(el)}
        else if(!on&&(d.fullscreenElement||d.webkitFullscreenElement)){(d.exitFullscreen||d.webkitExitFullscreen).call(d)}}catch(e){}
    try{if(on&&navigator.wakeLock)navigator.wakeLock.request('screen').catch(()=>{})}catch(e){}
    if(on)showHint('Tap to show controls');
    layoutSoon();
  }
  st.addEventListener('click',()=>setFull(!document.body.classList.contains('full')));
  const sync=()=>{if(!document.fullscreenElement&&!document.webkitFullscreenElement&&document.body.classList.contains('full')&&document.fullscreenEnabled)setFull(false)};
  document.addEventListener('fullscreenchange',sync);document.addEventListener('webkitfullscreenchange',sync);
  showHint('Tap the blanket for full screen');
})();

const mix=(a,b,k)=>a.map((v,i)=>v+(b[i]-v)*k);
const cur={top:[20,22,50],bot:[4,5,15],b:.6,m:1,starC:[255,250,220],fallC:[255,255,255],fallV:.6};
const amt={stars:0,fall:0,waves:0,drift:0,flick:0,caustic:0,sparkle:0};
const L={};for(const k in LAYERS)L[k]=0;
const layerOn={};for(const k in LAYERS)layerOn[k]=false;
let effectsMode='off';
const ROOM=[{l:'Room: bedtime lamp',a:.22},{l:'Room: dark',a:.1},{l:'Room: lights on',a:.7}];let roomI=0;
let fadeTau=.8,idle=0,idleTarget=0,fxScale=.6,layerScale=.8;
let target=SCENES.calm,current='calm',flashA=0,flashC=[255,255,255],nextBolt=0,hot=.15,showLeds=false,mood=0,moodT=-1e9;
const isStar=new Uint8Array(N),ph=new Float32Array(N),spark=new Float32Array(N),fl=new Float32Array(N),buf=new Float32Array(N*3);
for(let k=0;k<N;k++){isStar[k]=Math.random()<.13?1:0;ph[k]=Math.random()*6.3}
const mkP=(n,v)=>Array.from({length:n},(_,i)=>({x:Math.random()*COLS,y:Math.random()*ROWS,v:v*(0.7+Math.random()*.6),i,p:Math.random()*6.3}));
const fallP=mkP(24,1.6),snowP=mkP(36,2.6),rainP=mkP(44,22),flyP=mkP(16,0);
let ripples=[],bolt=[];
// Ethereal background: a few soft clouds of the scene's colors that slowly drift to new spots and fade.
const blobs=Array.from({length:5},()=>({x:Math.random()*COLS,y:Math.random()*ROWS,tx:Math.random()*COLS,ty:Math.random()*ROWS,
  mix:Math.random(),tmix:Math.random(),a:.5,ta:.7,r:4,tr:4,next:0}));
function moveBlobs(now,dt){const mo=target.mo,tempo=target.tempo?target.tempo:mo==='flicker'?2.2:mo==='waves'?1.4:mo==='caustic'?1.3:mo==='still'?.6:1;for(const b of blobs){
  if(now>b.next){b.tx=-1+Math.random()*(COLS+1);b.ty=-1+Math.random()*(ROWS+1);b.tmix=Math.random();b.ta=.35+.65*Math.random();b.tr=3+Math.random()*3.5;b.next=now+(8000+Math.random()*10000)/tempo}
  const e=Math.min(1,dt*tempo/7);b.x+=(b.tx-b.x)*e;b.y+=(b.ty-b.y)*e;b.mix+=(b.tmix-b.mix)*e;b.a+=(b.ta-b.a)*Math.min(1,dt/5);b.r+=(b.tr-b.r)*e}}
function ripple(x,y,col,speed,width,life){ripples.push({x,y,col,speed,w:width,life,r:0})}
function burst(n){for(let i=0;i<n;i++)spark[(Math.random()*N)|0]=1}
function flash(col,a){flashC=col;flashA=Math.max(flashA,a)}
function lightning(strength){
  flash([230,236,255],.55*strength);let i=(Math.random()*COLS)|0;bolt=[];
  for(let j=0;j<ROWS;j++){bolt.push(j*COLS+i);if(Math.random()<.5)i=Math.max(0,Math.min(COLS-1,i+(Math.random()<.5?-1:1)))}
  bolt.life=strength;ripple(bolt[0]%COLS,0,[220,230,255],38,5,strength*.8);
}
function add(k,c,a){buf[k*3]+=c[0]*a;buf[k*3+1]+=c[1]*a;buf[k*3+2]+=c[2]*a}
function dot(x,y,c,a,spread){const ci=Math.round(x),cj=Math.round(y);
  for(let j=cj-1;j<=cj+1;j++)for(let i=ci-1;i<=ci+1;i++){if(i<0||j<0||i>=COLS||j>=ROWS)continue;const w=a*Math.exp(-((i-x)**2+(j-y)**2)/spread);if(w>.004)add(j*COLS+i,c,w)}}
function hsv(h){const f=(n)=>{const k=(n+h*6)%6;return 255*(1-Math.max(0,Math.min(k,4-k,1)))};return[f(5),f(3),f(1)]}
let last=performance.now();
let frameErr=0;
function frame(now){
  requestAnimationFrame(frame);
  try{frameBody(now)}catch(e){if(frameErr++<3){console.error(e);try{document.getElementById('status').textContent='Display error: '+(e&&e.message||e)}catch(_){}}}
}
function frameBody(now){
  if(ctx.isContextLost&&ctx.isContextLost()){freshCanvas();return}
  const dt=Math.min(.1,(now-last)/1000);last=now;const t=now/1000;
  const k8=1-Math.exp(-dt/fadeTau),k15=1-Math.exp(-dt/1.5);
  idle+=(idleTarget-idle)*Math.min(1,dt/3);
  const sc=target,mo=sc.mo;
  cur.top=mix(cur.top,sc.top,k8);cur.bot=mix(cur.bot,sc.bot,k8);cur.b+=(sc.b-cur.b)*k8;
  cur.starC=mix(cur.starC,sc.starC||[255,250,220],k8);
  if(sc.fall){cur.fallC=mix(cur.fallC,sc.fall.c,k8);cur.fallV+=(sc.fall.v-cur.fallV)*k8}
  const want={stars:sc.stars||0,fall:sc.fall?sc.fall.n:0,waves:mo==='waves'?1:0,drift:mo==='drift'?1:0,flick:mo==='flicker'?1:0,caustic:mo==='caustic'?1:0,sparkle:sc.sparkle||0};

//  P  particles  (color, count, direction, speed, size, blink, trail)

const FXI={},FXWORD={},FXPAIRW={};
for(const fx of FXLIB){FXI[fx.id]=fx;for(const w of (fx.words||'').split(' ').filter(Boolean)){if(w.includes('_'))FXPAIRW[w.replace('_',' ')]=fx.id;else FXWORD[w]=fx.id}}
const active=new Map(),fxev={},fxCool={},fxLast={};let fxDecayT=performance.now();
const MAXFX=4;
function reg(r,i,j){switch(r){
  case 'top':return Math.max(0,1-j/(ROWS*.55));case 'bottom':return Math.max(0,(j-ROWS*.45)/(ROWS*.55));
  case 'left':return Math.max(0,1-i/(COLS*.55));case 'right':return Math.max(0,(i-COLS*.45)/(COLS*.55));
  case 'center':return Math.exp(-((i-(COLS-1)/2)**2/18+(j-(ROWS-1)/2)**2/28));
  case 'edges':return Math.exp(-Math.min(i,j,COLS-1-i,ROWS-1-j)/1.5);default:return 1}}
function initPart(p){
  if(p.k==='p')return{list:Array.from({length:p.n},()=>({x:Math.random()*COLS,y:Math.random()*ROWS,p:Math.random()*6.3,r:1.5+Math.random()*5.5,ang:Math.random()*6.3,dx:0,dy:1}))};
  return{next:0,a:0};
}
function startFx(id,why){
  const fx=FXI[id],now=performance.now();if(!fx||current==='sleep')return;
  if(fx.intense&&fxScale<=0)return;
  if(effectsMode==='off')return;
  const a=active.get(id);
  if(a){if(!fx.hold)a.until=Math.max(a.until,now+fx.dur*1000);return}
  if(!fx.hold&&now<(fxCool[id]||0))return;
  if(active.size>=MAXFX){let old=null;for(const[k,v]of active)if(!old||v.born<old[1].born)old=[k,v];active.delete(old[0])}
  active.set(id,{fx,born:now,until:fx.hold?Infinity:now+fx.dur*1000,amp:0,st:fx.parts.map(initPart)});
  renderLayers();if(why)showHit(why);
}
function decayFx(){const now=performance.now(),d=Math.exp(-(now-fxDecayT)/45000);fxDecayT=now;
  for(const id in fxev){fxev[id]*=d;const a=active.get(id);if(a&&a.fx.hold&&fxev[id]<.25)a.until=0}}
function fxEvidence(id,amount,why){
  const fx=FXI[id];if(!fx)return;lastCue=performance.now();fxLast[id]=lastCue;
  if(!fx.hold){startFx(id,why);return}
  decayFx();fxev[id]=Math.min(CAP,(fxev[id]||0)+amount);if(fxev[id]>=1)startFx(id,why);
}
function clearFx(){for(const a of active.values())a.until=0;renderLayers()}
function axis(dir,i,j){switch(dir){case 'right':return[i,COLS,j];case 'left':return[COLS-1-i,COLS,j];case 'up':return[ROWS-1-j,ROWS,i];
  case 'diag':return[(i+j)*.7,(COLS+ROWS)*.7,i-j];default:return[j,ROWS,i]}}
function drawPart(p,st,amp,dt,t,age,now){
  if(p.k==='shade'){for(let j=0;j<ROWS;j++)for(let i=0;i<COLS;i++){const k=j*COLS+i,m=1-p.a*amp*reg(p.region,i,j);buf[k*3]*=m;buf[k*3+1]*=m;buf[k*3+2]*=m}return}
  if(p.k==='glow'){const pf=p.pulse?.55+.45*Math.sin(6.283*p.pulse*t):1;for(let j=0;j<ROWS;j++)for(let i=0;i<COLS;i++)add(j*COLS+i,p.c,p.a*amp*pf*reg(p.region,i,j));return}
  if(p.k==='sweep'){const span=axis(p.dir,0,0)[1],cyc=p.period>0?p.period:1e9,pos=(age%cyc)*p.v-p.width;if(pos>span+p.width*2)return;
    for(let j=0;j<ROWS;j++)for(let i=0;i<COLS;i++){const[c]=axis(p.dir,i,j),a=Math.exp(-((c-pos)**2)/p.width),k=j*COLS+i;
      if(a<.01)continue;if(!p.c){const m=1-.6*amp*a;buf[k*3]*=m;buf[k*3+1]*=m;buf[k*3+2]*=m}else add(k,p.c,.7*amp*a)}return}
  if(p.k==='wave'){for(let j=0;j<ROWS;j++)for(let i=0;i<COLS;i++){const[c,,q]=axis(p.dir,i,j);add(j*COLS+i,p.c,p.a*amp*Math.max(0,Math.sin(c*p.freq-t*p.v+.5*Math.sin(q*.4+t*.5)))**2)}return}
  if(p.k==='twinkle'){for(let k=0;k<N;k++)if((ph[k]*7.13)%1<p.dens)add(k,p.c,p.a*amp*Math.max(0,Math.sin(t*p.v+ph[k]*5))**4);return}
  if(p.k==='flash'){if(now>st.next){st.a=1;st.next=now+(-Math.log(Math.random()+1e-6)/p.rate)*1000}
    st.a*=Math.exp(-dt/.15);if(st.a>.01)for(let k=0;k<N;k++)add(k,p.c,p.a*amp*st.a);return}
  if(p.k==='ripple'){if(now>st.next){st.next=now+(-Math.log(Math.random()+1e-6)/p.rate)*1000;
      const x=p.at==='center'?(COLS-1)/2:Math.random()*COLS,y=p.at==='top'?1:p.at==='bottom'?ROWS-2:p.at==='center'?(ROWS-1)/2:Math.random()*ROWS;
      ripple(x,y,p.c.map(v=>v*amp),p.v,p.w,1)}return}
  if(p.k==='p'){const cx=(COLS-1)/2,cy=(ROWS-1)/2;
    for(const q of st.list){const ox=q.x,oy=q.y;
      switch(p.dir){case 'down':q.y+=p.v*dt;break;case 'up':q.y-=p.v*dt;break;case 'right':q.x+=p.v*dt;break;case 'left':q.x-=p.v*dt;break;
        case 'diag':q.x+=p.v*.55*dt;q.y+=p.v*.85*dt;break;
        case 'drift':q.x+=Math.sin(t*.7+q.p)*p.v*dt;q.y+=Math.cos(t*.5+q.p*1.3)*p.v*.7*dt;break;
        case 'jitter':q.x+=((Math.random()-.5)*2+Math.sin(t*7+q.p)*.6)*p.v*dt;q.y+=((Math.random()-.5)*2+Math.cos(t*6+q.p)*.6)*p.v*dt;break;
        case 'swirl':q.ang+=p.v*dt/Math.max(1.5,q.r);q.x=cx+q.r*Math.cos(q.ang);q.y=cy+q.r*1.25*Math.sin(q.ang);break}
      if(q.x<-1.5)q.x+=COLS+3;if(q.x>COLS+1.5)q.x-=COLS+3;if(q.y<-1.5)q.y+=ROWS+3;if(q.y>ROWS+1.5)q.y-=ROWS+3;
      const mx=q.x-ox,my=q.y-oy,ml=Math.hypot(mx,my);if(ml>1e-4&&ml<3){q.dx=mx/ml;q.dy=my/ml}
      const b=amp*(p.blink?(1-p.blink)+p.blink*Math.max(0,Math.sin(t*2+q.p*3)):1);
      dot(q.x,q.y,p.c,b,p.size);
      for(let s=1;s<=p.trail;s++)dot(q.x-q.dx*s*.7,q.y-q.dy*s*.7,p.c,b*(1-s/(p.trail+1))*.7,p.size)}}
}
function fxFrame(dt,t,now){
  if(!active.size)return;decayFx();
  for(const[id,a]of active){const fx=a.fx;
    const scale=fx.hold?layerScale:(fx.intense?fxScale:Math.max(fxScale,.5));
    a.amp+=((now<a.until?scale:0)-a.amp)*Math.min(1,dt/.6);
    if(now>=a.until&&a.amp<.02){active.delete(id);fxCool[id]=now+8000;renderLayers();continue}
    const age=(now-a.born)/1000;fx.parts.forEach((p,pi)=>drawPart(p,a.st[pi],a.amp,dt,t,age,now));
  }
}

function thingSpec(e){
  const mo=e.motion||'still',v=+e.speed||0,shape=['blob','flake','point','glow'].includes(e.shape)?e.shape:'blob';
  return{shape,size:Math.max(.3,Math.min(4,+e.size||1)),c:e.colors[0],palette:e.colors.length>1?e.colors:null,
    bright:e.emits?1:.9,blend:e.emits&&shape!=='blob'?'add':'mix',blink:Math.min(1,+e.twinkle||0)*.8,
    fall:mo==='fall'?1:mo==='rise'?-1:0,v:v||.6,sway:(mo==='flutter'||mo==='fall'||mo==='rise')?.7:mo==='wander'?1:0,
    move:['drift','fly','swim','sweep','wander','flutter'].includes(mo)?(v||.6):0,
    mo,n:Math.max(1,Math.min(20,+e.count||5)),bg:Array.isArray(e.bg)&&e.bg.length===2?e.bg:null,bgs:+e.bg_strength||0,with:e.with||[],thing:true};

async function loadThings(){
  try{const r=await fetch('things.json');if(!r.ok)return;const list=await r.json();
    for(const e of list){if(!e||!e.name||!Array.isArray(e.colors)||!e.colors.length)continue;
      const nm=e.name.toLowerCase().trim(),key=nm.replace(/\s+/g,'_');if(OBJ[key])continue;
      if(COLORW[nm]||MULTIW.has(nm)||/^(light |dark |pale |bright |deep )?(red|orange|yellow|green|blue|purple|pink|white|black|gold|silver|brown|gr[ae]y|violet|indigo|teal|turquoise)$/.test(nm)||THING_SKIP.has(nm))continue;
      const sp=thingSpec(e);
      // huge scene-defining things (the sea, a meadow, dusk) set the background instead of being drawn as a shape
      if((sp.shape==='blob'||sp.shape==='glow')&&sp.size>=3.5&&sp.bgs>=.5&&!/tree|rainbow|dragon|whale|castle|moon|sun/.test(nm))sp.bgOnly=true;
      OBJ[key]=sp;thingsCount++;
      for(const a of [e.name,...(e.aliases||[])]){const al=String(a).toLowerCase().trim().replace(/[^a-z ]/g,'');if(!al)continue;
        if(al.includes(' '))THINGS_MULTI.set(al,key);else if(!OBJ[al]&&!ALIAS[al])ALIAS[al]=key}}
  }catch(e){}
}
function mergeThings(ws){
  for(let L=3;L>=2;L--)for(let i=0;i+L<=ws.length;i++){const k=ws.slice(i,i+L).join(' ');const key=THINGS_MULTI.get(k)||THINGS_MULTI.get(k.replace(/s$/,''))||THINGS_MULTI.get(k.replace(/es$/,''));
    if(key)ws.splice(i,L,key)}
  return ws;
}
function pullBackground(bg,strength){
  if(sceneSys!=='recipe')return;const k=Math.min(.85,strength),now=performance.now();
  rcp.A=mix(rcp.A,bg[0],k);rcp.B=mix(rcp.B,bg[1],k);
  const S=SCENES.recipe,vivid=c=>{const l=(c[0]+c[1]+c[2])/3;return c.map(x=>Math.max(0,Math.min(255,l+(x-l)*1.3)))};
  S.top=vivid(rcp.A);S.bot=vivid(rcp.B);S.b=Math.max(S.b||.6,.65);
  if(current!=='recipe'){current='recipe';target=S;fadeTau=1.2;sceneSince=now}
  rcpPending.bgHoldUntil=now+9000;rcpPending.anchor=rcp.A.concat(rcp.B);
}

function objName(w){if(OBJ[w])return w;if(ALIAS[w])return ALIAS[w];const s=w.replace(/s$/,'');return OBJ[s]?s:null}
function placeFor(spec,mods,others){
  // No top or bottom: pick spots across the whole blanket, as far as possible from others of the same kind.
  const m=spec.shape==='blob'?Math.min(2,(spec.size||1)*.5):.5;
  if(mods.pos==='center'||spec.pos==='center')return[(COLS-1)/2+(Math.random()-.5)*3,(ROWS-1)/2+(Math.random()-.5)*4];
  let best=null,bd=-1;
  for(let n=0;n<14;n++){const x=m+Math.random()*(COLS-1-2*m),y=m+Math.random()*(ROWS-1-2*m);
    let d=99;for(const o of others)d=Math.min(d,Math.hypot(o.x-x,o.y-y));if(d>bd){bd=d;best=[x,y]}}
  return best;
}
// ---- Glow style: a mostly-lit, softly alive blanket (broad warm glows through sherpa), with a few large slow motifs ----
const Mood=(function(){

// ---------- Recipe AI: the tiny model writes the scene itself ----------
// Trained on ~24,000 sentence -> recipe examples. From the last ~20 words it predicts two colors,
// brightness, drift speed, whether the words are about a place at all, and which things should be there.
const Recipe=(()=>{
  const M=RECIPE_W,H=M.b1.length,NE=M.effects.length;
  const W1=new Float32Array(256*H);for(let i=0;i<256;i++)for(let j=0;j<H;j++)W1[i*H+j]=M.W1[i][j];
  const flat=(A,cols)=>{const f=new Float32Array(A.length*cols);A.forEach((r,i)=>r.forEach((x,j)=>f[i*cols+j]=x));return f};
  const K=M.K,Wc=flat(M.Wc,K),Wr=flat(M.Wr,2),Wl=flat(M.Wl,1),Wf=flat(M.Wf,NE);
  const sig=z=>1/(1+Math.exp(-z));
  function predict(v){
    const h=new Float32Array(H);for(let j=0;j<H;j++)h[j]=M.b1[j];
    for(let i=0;i<256;i++){const x=v[i];if(!x)continue;const o=i*H;for(let j=0;j<H;j++)h[j]+=x*W1[o+j]}
    for(let j=0;j<H;j++)h[j]=Math.tanh(h[j]);
    const lin=(W,b,n)=>{const r=new Float32Array(n);for(let k=0;k<n;k++){let s=b[k];for(let j=0;j<H;j++)s+=h[j]*W[j*n+k];r[k]=s}return r};
    // palette: probability over learned color pairs, sharpened so colors stay vivid instead of averaging to gray
    const z=lin(Wc,M.bc,K);let mx=-1e9;for(const x of z)mx=Math.max(mx,x);let sum=0;const q=new Float32Array(K);
    for(let k=0;k<K;k++){q[k]=Math.exp(2*(z[k]-mx));sum+=q[k]}
    const col=[0,0,0,0,0,0];for(let k=0;k<K;k++){const w=q[k]/sum;for(let c=0;c<6;c++)col[c]+=w*M.cent[k][c]}
    const r=lin(Wr,M.br,2).map(sig),l=sig(lin(Wl,M.bl,1)[0]),f=lin(Wf,M.bf,NE).map(sig);
    const fx={};M.effects.forEach((e,k)=>fx[e]=f[k]);
    return{A:col.slice(0,3),B:col.slice(3,6),br:r[0],drift:r[1],rel:l,fx};
  }
  return{predict,effects:M.effects};
})();
let sceneSys='recipe',rcpPlace=null;const rcpPending={k:null,n:0};
const rcp={A:[60,55,80],B:[14,12,24],br:.55,drift:.3,started:false};
const fxStreak={},fxLastHigh={},fxNextFlash={value:0};
const FX_OBJ={leaf:'leaf',snowflake:'snowflake',raindrop:'raindrop',petal:'petal',ember:'ember',bubble:'bubble',firefly:'firefly',star:'star',hearth:'hearth',cloud:'cloud',confetti:'confetti'};
const AUTO_N={star:12,cloud:3,hearth:1,firefly:8};
function spawnThing(name){
  const spec=OBJ[name];if(!spec)return;const now=performance.now(),n=AUTO_N[name]||spec.n||5;
  const placed=objs.filter(o=>o.name===name&&!o.dying),ang=Math.random()*6.283;
  for(let m=0;m<n;m++){const[x,y]=placeFor(spec,{},placed);let vx=0,vy=0;
    if(spec.fall){const a=gravAng+(spec.fall<0?Math.PI:0)+(Math.random()-.5)*.5,v=spec.v*(.7+Math.random()*.6);vx=Math.cos(a)*v;vy=Math.sin(a)*v}
    else if(name==='cloud'){vx=Math.cos(ang)*.35;vy=Math.sin(ang)*.35}
    else if(spec.move){const a=Math.random()*6.283,v=spec.move*(.7+Math.random()*.6);vx=Math.cos(a)*v;vy=Math.sin(a)*v}
    const o={name,shape:spec.shape,blend:spec.blend||'add',x,y,size:spec.size||1,c:spec.palette?spec.palette[m%spec.palette.length]:spec.c,
      sway:spec.sway||0,flick:spec.flicker||0,streak:spec.streak||0,vx,vy,bright:spec.bright,blink:spec.blink||0,ph:Math.random()*6.3,born:now,seen:now,a:0,dying:false,auto:true};
    objs.push(o);placed.push(o)}
  while(objs.length>60)objs.shift();renderLayers();
}
function recipeStep(){
  const text=recent.slice(-12).join(' ');if(!text)return;
  const t0=performance.now(),r=Recipe.predict(LullyModel.embed(text)),us=Math.round((performance.now()-t0)*1000),now=performance.now();
  const asleep=current==='sleep';
  // the story's colors have moved far from where this place started: treat it as a new place
  if(!rcpPending.anchor)rcpPending.anchor=rcp.A.concat(rcp.B);
  const moved=Math.hypot(rcp.A[0]-rcpPending.anchor[0],rcp.A[1]-rcpPending.anchor[1],rcp.A[2]-rcpPending.anchor[2])+Math.hypot(rcp.B[0]-rcpPending.anchor[3],rcp.B[1]-rcpPending.anchor[4],rcp.B[2]-rcpPending.anchor[5]);
  if(current==='recipe'&&moved>130){placeChanged(now,'recipe');rcpPending.anchor=rcp.A.concat(rcp.B)}
  if(r.rel>.5&&!(asleep&&now-sceneSince<8000)||!Mood.state().cur){
    Mood.setFromStory(r.rel>.5?r.A:[230,140,80],r.rel>.5?r.B:[200,90,110],r.rel>.5?r.br:.6,r.rel>.5?r.drift:.25,r.fx);
  }
  if(r.rel>.5&&!(asleep&&now-sceneSince<8000)){
    const w=Math.min(.4,.3*r.rel)*(now<(rcpPending.bgHoldUntil||0)?.2:1);
    const before=rcp.A.slice();
    rcp.A=mix(rcp.A,r.A,w);rcp.B=mix(rcp.B,r.B,w);rcp.br+=(r.br-rcp.br)*w;rcp.drift+=(r.drift-rcp.drift)*w;
    const S=SCENES.recipe,vivid=c=>{const l=(c[0]+c[1]+c[2])/3;return c.map(x=>Math.max(0,Math.min(255,l+(x-l)*1.3)))};S.top=vivid(rcp.A);S.bot=vivid(rcp.B);S.b=Math.max(.2,rcp.br);S.tempo=.6+rcp.drift*1.6;
    if(current!=='recipe'){current='recipe';target=S;fadeTau=1.2;sceneSince=now}
    if(Math.hypot(before[0]-rcp.A[0],before[1]-rcp.A[1],before[2]-rcp.A[2])>25)gravAng+=(Math.random()-.5)*.4;
    lastCue=now;
  }
  // things the recipe says should be there
  for(const e of Recipe.effects){const p=r.fx[e];
    if(p>.75){fxStreak[e]=(fxStreak[e]||0)+1;fxLastHigh[e]=now}else fxStreak[e]=0;
    if(e==='flash'){if(p>.75&&now>fxNextFlash.value){flash([230,236,255],.45);fxNextFlash.value=now+3500+Math.random()*4000}continue}
    const name=FX_OBJ[e];if(!name)continue;
    const have=objs.some(o=>o.name===name&&!o.dying);
    if(fxStreak[e]>=2&&!have&&!asleep&&now>(rcpPending.quietUntil||0))spawnThing(name);
    if(have&&now-(fxLastHigh[e]||0)>9000)objs.forEach(o=>{if(o.name===name&&o.auto)o.dying=true});
  }
  const near=LullyModel.classify(text).find(x=>x[0]!=='none'&&SCENES[x[0]]);
  // a clear change of place clears things that belonged to the old place (unless just mentioned)
  if(near&&near[1]>.45&&r.rel>.5){if(near[0]===rcpPending.k)rcpPending.n++;else{rcpPending.k=near[0];rcpPending.n=1}
    if(rcpPending.n>=3&&rcpPending.k!==rcpPlace){if(rcpPlace){placeChanged(now,'recipe');rcpPending.anchor=rcp.A.concat(rcp.B)}rcpPlace=rcpPending.k}}
  if(Painter.active()||Cloud.on())return;
  if(current==='recipe')sceneEl.textContent='Story colors';
  const sw=(c)=>'#'+c.map(x=>Math.max(0,Math.min(255,x|0)).toString(16).padStart(2,'0')).join('');
  aiEl.textContent=`Recipe AI ${us} µs · about a place ${Math.round(r.rel*100)}% · colors ${sw(r.A)} + ${sw(r.B)} · `+Recipe.effects.filter(e=>r.fx[e]>.6).join(', ');
}

const LPROTOS={
  none:['she said hello to her friend','he ate his sandwich at the table','they walked along the path talking','the little mouse smiled and nodded','she opened the door and looked around'],
  storm:['a storm rolled in with thunder and lightning','dark clouds piled up and the sky grumbled','thunder boomed and lightning flashed'],

};
const MODELS={
  lully:{id:'Lully tiny',label:'Model: Lully tiny (instant)',mb:8},
  bge:{id:'Xenova/bge-small-en-v1.5',pool:'cls',label:'Model: BGE small (accurate)',mb:34},
  mini:{id:'Xenova/all-MiniLM-L6-v2',pool:'mean',label:'Model: MiniLM (fast)',mb:23}
};
let modelKey='lully';
const AI_URL='https://cdn.jsdelivr.net/npm/@huggingface/transformers@4.3.1/dist/transformers.min.js';
const aiEl=document.getElementById('ai'),brainBtn=document.getElementById('brain'),modelBtn=document.getElementById('model');
let lastAiShot=-1e9,aiFx='',fxcents=null,brain='both',ai=null,aiLoading=null,cents=null,lcents=null,aiBusy=false,aiNew=0,aiLast=0,aiTimer=null,recent=[];
const BRAIN_LABEL={both:'Scenes: words + AI',ai:'Scenes: AI only',words:'Scenes: words only'};
function brainLabel(){brainBtn.textContent=BRAIN_LABEL[brain];modelBtn.textContent=MODELS[modelKey].label;aiEl.style.display=brain==='words'?'none':'block'}
async function centroidsOf(ext,table,pool){
  const keys=Object.keys(table),all=[],owner=[];keys.forEach(k=>table[k].forEach(s=>{all.push(s);owner.push(k)}));
  const vecs=(await ext(all,{pooling:pool,normalize:true})).tolist(),c={};
  vecs.forEach((v,i)=>{const k=owner[i];if(!c[k])c[k]=v.slice();else for(let j=0;j<v.length;j++)c[k][j]+=v[j]});
  for(const k of keys){let n=0;for(const x of c[k])n+=x*x;n=Math.sqrt(n);for(let j=0;j<c[k].length;j++)c[k][j]/=n}
  return c;
}
function loadAI(){
  if(brain==='words')return;if(aiLoading)return aiLoading;
  const mk=sceneSys==='recipe'?'lully':modelKey,M=MODELS[mk];
  if(mk==='lully'){
    aiLoading=(async()=>{aiEl.textContent='AI: loading the Lully tiny model (about 8 MB, first time only)…';
      await LullyModel.load();if(mk!==modelKey)return;ai='lully';aiEl.textContent='AI: ready (Lully tiny). Start reading.';scheduleAI()})()
      .catch(e=>{aiEl.textContent='Lully tiny couldn’t load ('+(e&&e.message||e)+'). Put potion.bin and vocab.txt in the same folder as this page.';aiLoading=null});
    return aiLoading;
  }
  aiLoading=(async()=>{
    aiEl.textContent=`AI: downloading ${M.id.split('/')[1]} (about ${M.mb} MB, first time only)…`;
    const T=await import(AI_URL);
    const ext=await T.pipeline('feature-extraction',M.id,{dtype:'q8',
      progress_callback:p=>{if(p&&p.status==='progress'&&p.total&&/onnx/.test(p.file||''))aiEl.textContent=`AI: downloading ${Math.round(p.loaded/p.total*100)}%`}});
    aiEl.textContent='AI: learning the scenes…';
    const c=await centroidsOf(ext,PROTOS,M.pool),lc=await centroidsOf(ext,LPROTOS,M.pool);
    const fd={};for(const fx of FXLIB)fd[fx.id]=fx.desc;const fc=await centroidsOf(ext,fd,M.pool);
    if(mk!==modelKey)return;
    cents=c;lcents=lc;fxcents=fc;ai=ext;aiEl.textContent='AI: ready. Start reading.';scheduleAI();
  })().catch(e=>{aiEl.textContent='AI couldn’t load ('+(e&&e.message||e)+'). Keywords still work.';aiLoading=null});
  return aiLoading;
}
function noteWord(w){recent.push(w);if(recent.length>40)recent.splice(0,recent.length-40);aiNew++;scheduleAI()}
function scheduleAI(){
  if(!ai||aiBusy||brain==='words'||aiNew===0)return;
  const wait=1200-(performance.now()-aiLast);
  if(ai==='lully'||aiNew>=3||wait<=0){clearTimeout(aiTimer);aiTimer=null;runAI()}
  else if(!aiTimer)aiTimer=setTimeout(()=>{aiTimer=null;scheduleAI()},wait);
}
function rank(v,c){return Object.keys(c).map(k=>{const x=c[k];let d=0;for(let j=0;j<x.length;j++)d+=x[j]*v[j];return[k,d]}).sort((a,b)=>b[1]-a[1])}
async function runAI(){
  aiBusy=true;aiNew=0;aiLast=performance.now();
  const text=recent.slice(-16).join(' ');
  if(ai==='lully'&&sceneSys==='recipe'){recipeStep();aiBusy=false;if(aiNew>0)setTimeout(scheduleAI,0);return}
  if(ai==='lully'){
    // Our own trained classifier: runs on every word, in well under a millisecond.
    const t0=performance.now(),r=LullyModel.classify(recent.slice(-14).join(' ')),us=Math.round((performance.now()-t0)*1000);
    const pNone=(r.find(x=>x[0]==='none')||[0,0])[1],top=r.filter(x=>x[0]!=='none'&&SCENES[x[0]]);
    const[sb,p]=top[0];
    if(brain!=='words'){
      remember(sb,p*.5);
      if(p>.4&&p>pNone)addEv(sb,Math.min(.4,(p-.25)*.7),k=>`AI → ${SCENES[k].name} (${Math.round(p*100)}%)`);
    }
    const held=Math.round((performance.now()-sceneSince)/1000);
    aiEl.textContent=`AI ${us} µs · `+top.slice(0,3).map(([k,q])=>`${SCENES[k].name} ${Math.round(q*100)}%`).join(' · ')+` · nothing ${Math.round(pNone*100)}% · holding ${SCENES[current].name} ${held}s`;
    aiBusy=false;if(aiNew>0)setTimeout(scheduleAI,0);return;
  }
  try{
    const t0=performance.now();
    const v=(await ai(text,{pooling:MODELS[modelKey].pool,normalize:true})).data;
    const ss=rank(v,cents),ls=rank(v,lcents),ms=Math.round(performance.now()-t0);
    const sNone=ss.find(x=>x[0]==='none')[1],sTop=ss.filter(x=>x[0]!=='none');
    const lNone=ls.find(x=>x[0]==='none')[1],lTop=ls.filter(x=>x[0]!=='none');
    const[sb,s1]=sTop[0],sgap=s1-Math.max(sNone,sTop[1][1]);
    const[lb,l1]=lTop[0],lgap=l1-Math.max(lNone,lTop[1][1]);
    if(brain!=='words'){
      if(s1-sNone>0)remember(sb,(s1-sNone)*1.5);
      if(s1-sNone>0.03&&sgap>0.01)addEv(sb,Math.min(1,(s1-sNone)*8),k=>`AI → ${SCENES[k].name}`);
      if(effectsMode==='full'&&l1-lNone>0.05&&lgap>0.01)addLayer(lb,Math.min(.9,(l1-lNone)*7),`AI → + ${LAYERS[lb]}`);
      const fs=rank(v,fxcents),[fb,f1]=fs[0],fgap=f1-lNone;
      const nowA=performance.now(),one=!FXI[fb].hold;
      if(fgap>(one?0.13:0.10)&&f1-fs[1][1]>0.015&&(!one||nowA-lastAiShot>20000)&&effectsMode==='full'){if(one)lastAiShot=nowA;fxEvidence(fb,.6,`AI → ${FXI[fb].name}`)}
      aiFx=`${FXI[fb].name} ${fgap.toFixed(2)}`;
    }
    const held=Math.round((performance.now()-sceneSince)/1000);
    aiEl.textContent=`AI ${ms} ms · place: ${SCENES[sb].name} ${(s1-sNone).toFixed(2)} · weather: ${LAYERS[lb]} ${(l1-lNone).toFixed(2)} · effect: ${aiFx} · holding ${SCENES[current].name} ${held}s`;
  }catch(e){aiEl.textContent='AI error: '+(e&&e.message||e)}
  aiBusy=false;if(aiNew>0)setTimeout(scheduleAI,50);
}
brainBtn.addEventListener('click',()=>{brain=brain==='both'?'ai':brain==='ai'?'words':'both';brainLabel();loadAI()});
modelBtn.addEventListener('click',()=>{modelKey=modelKey==='lully'?'mini':modelKey==='mini'?'bge':'lully';ai=null;aiLoading=null;cents=lcents=null;brainLabel();aiEl.textContent='Model switched. It will load on your next Start or demo.'});
brainLabel();
loadThings();
const reactBtn=document.getElementById('react');
function applyReact(){const Rm=REACT[react];fxScale=Rm.fx;layerScale=Rm.layer;reactBtn.textContent=Rm.label}
reactBtn.addEventListener('click',()=>{react=react==='calm'?'balanced':react==='balanced'?'lively':'calm';applyReact();showHit(REACT[react].label)});
applyReact();
document.getElementById('scenesys').addEventListener('click',e=>{
  sceneSys=sceneSys==='recipe'?'fixed':'recipe';e.currentTarget.textContent=sceneSys==='recipe'?'Scenes: AI recipes':'Scenes: fixed list';
  ai=null;aiLoading=null;objs.forEach(o=>{if(o.auto)o.dying=true});
  if(sceneSys==='fixed'&&current==='recipe'){current='calm';target=SCENES.calm;sceneEl.textContent='Ready'}
  brainLabel();showHit(e.currentTarget.textContent);aiEl.textContent='Switched. The AI loads on your next Start or demo.';
});
const FXMODES={rare:'Effects: rare',off:'Effects: off',full:'Effects: full'};
document.getElementById('fxmode').addEventListener('click',e=>{effectsMode=effectsMode==='rare'?'off':effectsMode==='off'?'full':'rare';
  e.currentTarget.textContent=FXMODES[effectsMode];if(effectsMode==='off'){clearFx();for(const x in LAYERS){lev[x]=0;setLayer(x,false)}}showHit(FXMODES[effectsMode])});
setInterval(()=>{
  const now=performance.now(),Rm=REACT[react];decayStory(now);
  if(sceneSys==='recipe')return;
  if(current!=='calm'&&current!=='sleep')addEv('calm',0,k=>`story → ${SCENES[k].name}`);
  const quiet=now-lastCue>15000&&current!=='calm'&&current!=='sleep';
  if(quiet!==!!idleTarget){idleTarget=quiet?1:0;renderLayers()}
  if(current==='sleep')return;
  let best=null;for(const k in story)if(k!=='calm'&&k!=='sleep'&&k!=='recipe'&&(!best||story[k]>story[best]))best=k;
  if(!best||best===current)return;
  const first=current==='calm',
        eligible=first||(now-lastCue>=Rm.ambientAfter&&now-sceneSince>=(react==='calm'?20000:Rm.hold));
  if(eligible&&story[best]>=1&&story[best]>story[current]*1.2+.3){sceneSince=now;placeChanged(now,best);setScene(best,`Story so far → ${SCENES[best].name}`,true)}
},1000);

// ---------- Transcript ----------
const textEl=document.getElementById('text');let finalText='',interim='';
function render(){
  const f=finalText.slice(-160);
  textEl.innerHTML='';const a=document.createElement('span');a.textContent=f+' ';const b=document.createElement('span');b.className='i';b.textContent=interim;
  textEl.append(a,b);
}

// ---------- Speech engines ----------
// "web": the browser's built-in speech service (Safari on iPhone, Chrome on Android/desktop, Edge).
// "vosk": an on-device recognizer that runs inside the page, for browsers that block the built-in one (Chrome/Firefox/Edge on iPhone).
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
const ua=navigator.userAgent;
const isIOS=/iPad|iPhone|iPod/.test(ua)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
const iosOther=isIOS&&/CriOS|FxiOS|EdgiOS|OPiOS|GSA/.test(ua);
const hasMic=!!(navigator.mediaDevices&&navigator.mediaDevices.getUserMedia);
let engine=(SR&&!iosOther)?'web':(hasMic?'vosk':null);
const goBtn=document.getElementById('go'),engBtn=document.getElementById('eng'),statusEl=document.getElementById('status'),warn=document.getElementById('warn');
let running=false,wakeLock=null,startedAt=0,results=0;
function status(s){statusEl.textContent=s}
function say(s){warn.style.display='block';warn.textContent=s}
function engLabel(){engBtn.textContent=engine==='web'?'Engine: browser':'Engine: on-device'}
engLabel();
if(!(SR&&hasMic))engBtn.style.display='none';
if(!engine){say('This browser can’t reach a microphone. Try Safari or Chrome. The Demo and typing box still work.');goBtn.disabled=true;goBtn.style.opacity=.5}
function tick(){results++;status(`Listening (${engine==='web'?'browser':'on-device'}) · ${results} updates in ${Math.round((performance.now()-startedAt)/1000)}s`)}
function diffFeed(ws,prev){for(let j=0;j<ws.length;j++)if(prev[j]!==ws[j])feedWord(ws[j])}

// --- Built-in browser speech ---
let rec=null,seen={};
function startWeb(){
  rec=new SR();rec.lang='en-US';rec.continuous=true;rec.interimResults=true;seen={};
  rec.onresult=e=>{
    interim='';
    for(let i=e.resultIndex;i<e.results.length;i++){
      const r=e.results[i],txt=r[0].transcript,ws=txt.trim().split(/\s+/);
      diffFeed(ws,seen[i]||[]);seen[i]=ws;
      if(r.isFinal){finalText+=' '+txt.trim();speechFinal(txt)}else interim+=txt;
    }
    render();tick();
  };
  rec.onerror=e=>{
    if(e.error==='service-not-allowed'&&hasMic){
      running=false;try{rec.abort()}catch(_){}engine='vosk';engLabel();uiStopped();
      say('This browser blocks its built-in speech service, so I switched to the on-device engine. Tap Start listening again.');
    }else if(e.error==='not-allowed'){
      running=false;uiStopped();say('Microphone access was blocked for this site. Allow it in the browser’s site settings, then tap Start again.');
    }else if(e.error!=='no-speech'&&e.error!=='aborted')status('Hiccup: '+e.error+' · restarting');
  };
  rec.onend=()=>{if(running&&engine==='web'){status('Restarting listener…');setTimeout(()=>{if(running)try{startWeb()}catch(_){}} ,150)}};
  rec.start();
}
function stopWeb(){try{rec&&rec.stop()}catch(_){}}

// --- On-device (Vosk) speech ---
const VOSK_JS='https://cdn.jsdelivr.net/npm/vosk-browser@0.0.8/dist/vosk.js';
const MODEL_URL='https://ccoreilly.github.io/vosk-browser/models/vosk-model-small-en-us-0.15.tar.gz';
let voskModel=null,voskRec=null,ac=null,stream=null,node=null,src=null,prevPartial=[];
function loadScript(u){return new Promise((res,rej)=>{const s=document.createElement('script');s.src=u;s.onload=res;s.onerror=()=>rej(new Error('could not load the speech library'));document.head.append(s)})}
async function startVosk(){
  ac=new (window.AudioContext||window.webkitAudioContext)();   // created inside the tap, as iOS requires
  if(ac.resume)ac.resume();
  status('Asking for the microphone…');
  stream=await navigator.mediaDevices.getUserMedia({video:false,audio:{echoCancellation:true,noiseSuppression:true,channelCount:1}});
  if(!voskModel){
    status('Downloading the on-device speech model (about 40 MB, first time only)…');
    if(!window.Vosk)await loadScript(VOSK_JS);
    voskModel=await Vosk.createModel(MODEL_URL);
  }
  if(!running){stopVosk();return}
  voskRec=new voskModel.KaldiRecognizer(ac.sampleRate);prevPartial=[];
  voskRec.on('partialresult',m=>{const p=(m.result.partial||'').trim();if(!p)return;const ws=p.split(/\s+/);diffFeed(ws,prevPartial);prevPartial=ws;interim=p;render();tick()});
  voskRec.on('result',m=>{const t=(m.result.text||'').trim();if(t){diffFeed(t.split(/\s+/),prevPartial);finalText+=' '+t;speechFinal(t)}prevPartial=[];interim='';render();tick()});
  src=ac.createMediaStreamSource(stream);
  node=ac.createScriptProcessor(4096,1,1);
  node.onaudioprocess=e=>{try{voskRec&&voskRec.acceptWaveform(e.inputBuffer)}catch(_){}};
  src.connect(node);node.connect(ac.destination);
  startedAt=performance.now();status('Listening (on-device) · start reading');
}
function stopVosk(){
  try{node&&node.disconnect();src&&src.disconnect()}catch(_){}node=src=null;
  if(stream)stream.getTracks().forEach(t=>t.stop());stream=null;
  if(voskRec){try{voskRec.remove()}catch(_){}voskRec=null}
  if(ac){ac.close().catch(()=>{});ac=null}
}

// --- Controls ---
function uiStopped(){goBtn.textContent='Start listening';goBtn.classList.remove('stop');status('Stopped');if(wakeLock){wakeLock.release().catch(()=>{});wakeLock=null}}
function stopAll(){running=false;stopWeb();stopVosk();uiStopped()}
goBtn.addEventListener('click',async()=>{
  if(running){stopAll();return}
  warn.style.display='none';running=true;startedAt=performance.now();results=0;loadAI();
  goBtn.textContent='Stop';goBtn.classList.add('stop');status('Starting… allow the microphone if asked');
  try{if('wakeLock' in navigator)navigator.wakeLock.request('screen').then(w=>wakeLock=w).catch(()=>{})}catch(_){}
  try{
    if(engine==='web')startWeb();else await startVosk();
  }catch(err){
    stopAll();
    const blocked=err&&(err.name==='NotAllowedError'||err.name==='SecurityError');
    say(blocked?'Microphone access was blocked for this site. In Chrome on iPhone: tap the ⋯ menu → Settings → Content settings, or reload and choose Allow. Also check iPhone Settings → Chrome → Microphone.':'Couldn’t start: '+(err&&err.message||err));
  }
});
engBtn.addEventListener('click',()=>{if(running)stopAll();engine=engine==='web'?'vosk':'web';engLabel();status('Switched engine. Tap Start listening.')});

let demoTimer=null,demoBtn=null;
function stopDemo(){clearInterval(demoTimer);demoTimer=null;if(demoBtn)demoBtn.textContent=demoBtn.dataset.l;demoBtn=null}
function playDemo(btn,txt){
  if(demoTimer){const same=demoBtn===btn;stopDemo();if(same)return}
  loadAI();demoBtn=btn;btn.dataset.l=btn.dataset.l||btn.textContent;btn.textContent='Stop';
  const ws=txt.split(' ');let i=0;finalText='';
  demoTimer=setInterval(()=>{if(i>=ws.length){stopDemo();return}feedWord(ws[i]);finalText+=' '+ws[i];interim='';render();i++},380);
}
document.getElementById('demo').addEventListener('click',e=>playDemo(e.currentTarget,DEMO));
document.getElementById('aidemo').addEventListener('click',e=>playDemo(e.currentTarget,AIDEMO));
document.getElementById('typed').addEventListener('submit',e=>{
  e.preventDefault();loadAI();const inp=document.getElementById('line');const v=inp.value.trim();if(!v)return;
  for(const w of v.split(/\s+/))feedWord(w);finalText+=' '+v;interim='';render();inp.value='';inp.blur();
});
}
