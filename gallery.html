<h1>Lully scene samples</h1><p>42 test paintings, elegant style (round 2) by Claude Sonnet, running live. B = background, L = ongoing overlay, M = one-time moment (replays). Overlays are shown over a plain night-blue background. Tap any tile for full screen.</p>

<script>
const W=16,H=20,PI=Math.PI,{sin,cos,tan,abs,floor,min,max,sqrt,pow,exp,atan2,round}=Math;
const wrap=(v,n)=>((v%n)+n)%n;
const hash=n=>{const s=Math.sin(n*127.1+311.7)*43758.5453;return s-Math.floor(s)};
const h3=(x,y,z)=>hash(x*157+y*113+z*271);
const sm=t=>t*t*(3-2*t);
function noise(x,y,z){const X=floor(x),Y=floor(y),Z=floor(z),fx=sm(x-X),fy=sm(y-Y),fz=sm(z-Z);const L=(a,b,t)=>a+(b-a)*t;
 return L(L(L(h3(X,Y,Z),h3(X+1,Y,Z),fx),L(h3(X,Y+1,Z),h3(X+1,Y+1,Z),fx),fy),L(L(h3(X,Y,Z+1),h3(X+1,Y,Z+1),fx),L(h3(X,Y+1,Z+1),h3(X+1,Y+1,Z+1),fx),fy),fz)}
function hsv(h,s,v){h=((h%1)+1)%1;const i=floor(h*6),f=h*6-i,p=v*(1-s),q=v*(1-f*s),u=v*(1-(1-f)*s);const c=[[v,u,p],[q,v,p],[p,v,u],[p,q,v],[u,p,v],[v,p,q]][i%6];return c.map(k=>k*255)}
const clamp=(v,a,b)=>Array.isArray(v)?v.map(q=>q<a?a:q>b?b:q):v<a?a:v>b?b:v;
const mix=(a,b,k)=>typeof a==='number'?a+(b-a)*k:[a[0]+(b[0]-a[0])*k,a[1]+(b[1]-a[1])*k,a[2]+(b[2]-a[2])*k];
const smoothstep=(e0,e1,v)=>{const q=clamp((v-e0)/(e1-e0),0,1);return q*q*(3-2*q)};
const fract=v=>v-Math.floor(v);
function wrapd(ax,ay,bx,by){let dx=abs(ax-bx)%W,dy=abs(ay-by)%H;dx=min(dx,W-dx);dy=min(dy,H-dy);return sqrt(dx*dx+dy*dy)}

const ITEMS=[{"name": "gentle snowfall", "kind": "loop", "energy": 0.2, "code": "const T = t * P.speed;\nconst n = floor(8 + P.energy * 22);\nlet best = 0;\nlet tint = 0;\nfor (let i = 0; i < n; i++) {\n  const h1 = hash(i * 7.31 + 1.7);\n  const h2 = hash(i * 3.17 + 9.2);\n  const h3 = hash(i * 5.53 + 4.4);\n  const spd = 0.7 + h3 * 0.6;\n  const fy = wrap(h2 * H + T * spd, H);\n  const fx = wrap(h1 * W + sin(T * 0.6 * spd + i * 1.9) * 1.1 + sin(T * 0.23 + i) * 0.5, W);\n  const dx = abs(x - fx);\n  const dy = abs(y - fy);\n  const ddx = min(dx, W - dx);\n  const ddy = min(dy, H - dy);\n  const d = sqrt(ddx * ddx + ddy * ddy);\n  const size = 0.9 + h3 * 0.7;\n  const core = exp(-d * d / (size * 0.55));\n  const halo = exp(-d * d / (size * 4.5)) * 0.45;\n  const tw = 0.8 + 0.2 * sin(T * 1.3 + i * 2.1);\n  const v = (core + halo) * tw * (0.7 + h1 * 0.3);\n  if (v > best) {\n    best = v;\n    tint = core / (core + halo + 0.001);\n  }\n}\nconst a = clamp(best, 0, 1);\nconst white = [235, 244, 255];\nconst ice = [110, 170, 245];\nconst col = mix(ice, white, clamp(tint * 1.2, 0, 1));\nreturn [col[0], col[1], col[2], clamp(a * (0.6 + P.energy * 0.5), 0, 0.95)];\n"}, {"name": "falling autumn leaves", "kind": "loop", "energy": 0.35, "code": "const T = t * P.speed;\nconst N = 8 + floor(P.energy * 22);\nlet r = 0, g = 0, b = 0, a = 0;\nfor (let i = 0; i < N; i++) {\n  const h1 = hash(i * 3.17 + 1.3);\n  const h2 = hash(i * 5.71 + 2.9);\n  const h3 = hash(i * 7.43 + 4.1);\n  const spd = 0.35 + h2 * 0.35;\n  const fy = wrap(T * spd + h1 * H, H);\n  const sway = sin(T * (0.6 + h3 * 0.5) + h2 * 6.28) * (1.6 + h1 * 1.4);\n  const cx = wrap(h3 * W + sway + sin(fy * 0.5 + h1 * 6.28) * 0.8, W);\n  const dx = wrap(x - cx + W / 2, W) - W / 2;\n  const dy = wrap(y - fy + H / 2, H) - H / 2;\n  const ang = T * (0.5 + h2) * (h1 > 0.5 ? 1 : -1) + h3 * 6.28;\n  const u = dx * cos(ang) + dy * sin(ang);\n  const v = -dx * sin(ang) + dy * cos(ang);\n  const sz = 1.1 + h3 * 0.7;\n  const d2 = (u * u) / (sz * sz * 1.6) + (v * v) / (sz * sz * 0.55);\n  const f = exp(-d2 * 1.5);\n  if (f < 0.02) continue;\n  const rib = 1 - 0.25 * smoothstep(0.0, 0.5, abs(v) / sz) * 0 - 0.2 * exp(-u * u * 3);\n  const c = hsv(0.0 + h1 * 0.14, 0.9 - h2 * 0.12, (0.55 + 0.4 * h2) * rib);\n  const w = f * (0.55 + 0.45 * h2);\n  r += c[0] * w; g += c[1] * w; b += c[2] * w;\n  a = max(a, f * (0.65 + 0.3 * h3));\n}\nconst m = max(r, g, b);\nconst k = m > 235 ? 235 / m : 1;\nreturn [r * k, g * k, b * k, clamp(a, 0, 0.95)];\n"}, {"name": "autumn leaves falling", "kind": "loop", "energy": 0.35, "code": "const T = t * P.speed;\nconst n = 8 + floor(P.energy * 22);\nlet r = 0, g = 0, b = 0, a = 0;\nfor (let i = 0; i < 30; i++) {\n  if (i >= n) break;\n  const h1 = hash(i * 7.31 + 1.7);\n  const h2 = hash(i * 3.17 + 5.3);\n  const h3 = hash(i * 5.71 + 9.1);\n  const sp = 0.55 + h2 * 0.6;\n  const fall = T * sp + h3 * 20;\n  const ly = wrap(fall, 20);\n  const pend = sin(T * (0.7 + h1 * 0.5) + i * 1.9);\n  const ax = wrap(h1 * 16 + pend * (1.2 + h2 * 1.2) + sin(T * 0.3 + i) * 0.5, 16);\n  const rad = 0.8 + h3 * 0.7;\n  const ddx = wrapd(x, y, ax, y);\n  const dy = wrapd(x, y, x, ly);\n  const rot = pend * 0.7;\n  const rx = ddx * cos(rot) - dy * sin(rot);\n  const ry = ddx * sin(rot) + dy * cos(rot);\n  const d = sqrt(rx * rx * 1.5 + ry * ry * 0.7);\n  const f = exp(-d * d / (rad * rad));\n  if (f > 0.03) {\n    const c = hsv(0.015 + h1 * 0.1, 0.88 - h2 * 0.15, 0.55 + h3 * 0.4);\n    const w = f * (0.55 + 0.45 * h2);\n    r += c[0] * w;\n    g += c[1] * w;\n    b += c[2] * w;\n    a = max(a, clamp(f * 1.1, 0, 1));\n  }\n}\nreturn [clamp(r, 0, 235), clamp(g, 0, 200), clamp(b, 0, 150), a];\n"}, {"name": "police car chase", "kind": "loop", "energy": 0.9, "code": "const T = t * P.speed;\nconst E = P.energy;\nlet r = 0, g = 0, b = 0, a = 0;\nconst hx = 8 + 7.5 * sin(T * 0.9 + 1.3 * sin(T * 0.37));\nconst hy = 10 + 9.5 * sin(T * 0.63 + 0.8);\nfor (let k = 0; k < 6; k++) {\n  const f = k % 3;\n  const trail = floor(k / 3);\n  const lag = (1.1 + f * 0.8) * 0.45 + trail * 0.12;\n  const s = T - lag;\n  const px = wrap(8 + 7.8 * sin(s * 0.9 + 1.3 * sin(s * 0.37)) + 3 * sin(s * 5 + f * 2), W);\n  const py = wrap(10 + 9.8 * sin(s * 0.63 + 0.8) + 2.5 * sin(s * 4.3 + f), H);\n  const ph = 0.5 * sin(T * 5 + f * 1.7) + 0.5;\n  const sw = ph > 0.5 ? 0 : 1;\n  const ox = (sw ? 1.3 : -1.3);\n  const d1 = wrapd(x, y, px + ox, py);\n  const d2 = wrapd(x, y, px - ox, py);\n  const dd = wrapd(x, y, px, py);\n  const blue = exp(-d1 * d1 * 0.5) * (sw ? 1 : 0.15);\n  const red = exp(-d2 * d2 * 0.5) * (sw ? 0.15 : 1);\n  const tr = exp(-dd * dd * 0.12) * 0.18;\n  const amp = (0.6 + 0.4 * E) * (trail ? 0.35 : 1);\n  r += (235 * red + 40 * tr) * amp;\n  g += (30 * red + 60 * blue + 20 * tr) * amp;\n  b += (255 * blue + 120 * tr) * amp;\n  a += (red + blue) * amp + tr * 0.5;\n}\nconst dh = wrapd(x, y, hx, hy);\nconst hl = exp(-dh * dh * 0.35);\nconst hl2 = exp(-wrapd(x, y, hx + 2, hy + 1.5) * 0.9);\nr += 215 * hl + 120 * hl2 * hl;\ng += 220 * hl + 120 * hl2 * hl;\nb += 200 * hl + 110 * hl2 * hl;\na += hl * 0.9;\na = clamp(a, 0, 1) * (0.6 + 0.4 * E);\nconst m = max(r, g, b, 1);\nconst sc = m > 240 ? 240 / m : 1;\nreturn [r * sc, g * sc, b * sc, a];\n"}, {"name": "ambulance speeding past", "kind": "moment", "energy": 0.8, "code": "const T = t * P.speed;\nconst u = clamp(t / P.dur, 0, 1);\nconst env = smoothstep(0, 0.18, u) * (1 - smoothstep(0.78, 1, u));\nconst cx = 21 - u * 28;\nconst cy = 9.5 + sin(u * 5) * 1.5 + (noise(0, 0, 3) - 0.5) * 2;\nconst dx = x - cx;\nconst dy = y - cy;\nconst ahead = clamp(-dx, 0, 99);\nconst behind = clamp(dx, 0, 99);\nconst core = exp(-(dx * dx * 0.5 + dy * dy * 0.06));\nconst tail = dx > 0 ? exp(-behind * 0.28) * exp(-dy * dy * 0.05) : 0;\nconst beat = floor(T * 3.2);\nconst phase = fract(T * 3.2);\nconst side = beat % 2 === 0 ? 1 : -1;\nconst pulse = 0.55 + 0.45 * smoothstep(0, 0.2, phase) * (1 - smoothstep(0.7, 1, phase));\nconst sideMix = clamp(0.5 + side * (dy * 0.18 + dx * 0.04), 0, 1);\nconst red = [235, 20, 45];\nconst white = [235, 240, 255];\nconst pink = [230, 90, 140];\nlet col = mix(red, white, sideMix);\nconst lead = exp(-pow(abs(dx + 0.8), 2) * 0.9) * exp(-dy * dy * 0.12);\ncol = mix(col, white, clamp(lead * 0.8, 0, 1));\nconst tcol = mix(pink, red, clamp(behind / 12, 0, 1));\nconst wob = 0.85 + 0.15 * noise(x * 0.4, y * 0.4, T * 2);\nconst aCore = clamp(core * pulse * 1.1 * wob, 0, 1);\nconst aTail = clamp(tail * 0.55 * (0.7 + 0.3 * pulse), 0, 1);\nlet a = clamp(max(aCore, aTail) * env * (0.6 + 0.5 * P.energy), 0, 1);\nconst c = mix(tcol, col, clamp(aCore / (aCore + aTail + 0.001), 0, 1));\nreturn [clamp(c[0], 0, 240), clamp(c[1], 0, 240), clamp(c[2], 0, 240), a];\n", "dur": 3.5}, {"name": "inside the volcano crater", "kind": "bg", "energy": 0.45, "code": "const T = t * P.speed;\nconst e = P.energy;\nconst nx = x / W, ny = y / H;\nconst n1 = noise(x * 0.22 + T * 0.18, y * 0.22 - T * 0.12, T * 0.1);\nconst n2 = noise(x * 0.5 - T * 0.25, y * 0.5 + T * 0.2, 7 + T * 0.15);\nconst cx = x - 7.5, cy = y - 9.5;\nconst wob = noise(x * 0.3, y * 0.3, T * 0.2) * 2.2;\nconst d = sqrt(cx * cx + cy * cy) + wob;\nconst ripple = 0.5 + 0.5 * sin(d * 1.3 - T * 1.1 + n1 * 5);\nconst mag = smoothstep(0.35, 0.8, n1 * 0.7 + ripple * 0.5 + n2 * 0.25);\nconst cool = [26, 8, 14];\nconst crimson = [150, 22, 20];\nconst amber = [225, 120, 22];\nlet c = mix(crimson, amber, mag * mag);\nconst crack = smoothstep(0.6, 0.95, n2 * ripple + n1 * 0.3);\nc = mix(c, [235, 150, 50], crack * 0.4);\nconst rim = smoothstep(3.5, 9.5, d);\nconst flick = 0.55 + 0.45 * noise(x * 0.7, y * 0.7, T * 1.6) + 0.12 * sin(T * 2.3 + x);\nconst wall = mix(c, cool, rim * 0.75);\nconst glow = rim * (1 - rim * 0.5) * flick * (0.35 + e * 0.55);\nlet out = [wall[0] + 120 * glow * (0.5 + n1), wall[1] + 45 * glow * (0.5 + n1), wall[2] + 6 * glow];\nconst sky = smoothstep(2.6, 0.4, sqrt(cx * cx + cy * cy) - 6.8) * smoothstep(5.2, 7.8, d);\nconst twink = 0.7 + 0.3 * sin(T * 0.9 + hash(floor(x) * 31 + floor(y) * 7) * 6.28);\nconst skyc = [18 + 14 * twink, 20 + 12 * twink, 60 + 40 * twink];\nout = mix(out, skyc, clamp(sky * 0.55, 0, 0.55));\nconst breath = 0.88 + 0.12 * sin(T * 0.5 + n1 * 3);\nreturn [clamp(out[0] * breath, 0, 200), clamp(out[1] * breath, 0, 150), clamp(out[2] * breath, 0, 120)];\n"}, {"name": "laser eye beams", "kind": "moment", "energy": 0.85, "code": "const T = t * P.speed;\nconst d = P.dur;\nconst e = P.energy;\nconst ig = smoothstep(0.0, 0.35, t);\nconst sh = smoothstep(0.35, 0.6, t);\nconst fade = 1 - smoothstep(d - 0.9, d, t);\nconst fl = 0.82 + 0.18 * sin(T * 40 + y * 0.7) * noise(T * 9, y * 0.3, 1.7);\nlet rr = 0, gg = 0, bb = 0, a = 0;\nfor (let i = 0; i < 2; i++) {\n  const bx = 5.2 + i * 5.6;\n  const dx = abs(x - bx);\n  const lead = sh * 19.5;\n  const inb = smoothstep(lead + 1.2, lead - 0.6, y);\n  const wob = 0.25 * sin(y * 0.9 + T * 14 + i * 3) * (1 - 0.4 * i);\n  const dd = abs(x - bx - wob);\n  const core = exp(-dd * dd * 1.6) * inb * sh * fl;\n  const glow = exp(-dd * dd * 0.28) * inb * sh * 0.7;\n  const spark = ig * (1 - sh) * exp(-(dx * dx + y * y) * 0.9);\n  const hot = exp(-(dx * dx + (y - 19) * (y - 19)) * 0.16) * sh;\n  const sc = hot * (0.6 + 0.4 * noise(x * 0.8, y * 0.8, T * 3 + i)) * smoothstep(0.55, 1.2, t);\n  rr += 255 * core + 235 * glow + 255 * spark + 255 * sc;\n  gg += 235 * core + 30 * glow + 70 * spark + 120 * sc;\n  bb += 220 * core + 40 * glow + 60 * spark + 20 * sc;\n  a += core * 0.95 + glow * 0.8 + spark + sc * 0.85;\n}\nconst k = fade * (0.55 + 0.45 * e);\na = clamp(a * k, 0, 1);\nconst m = max(1, a * 1.15);\nreturn [clamp(rr / m, 0, 240), clamp(gg / m, 0, 235), clamp(bb / m, 0, 225), a];\n", "dur": 2.5}, {"name": "snowmelt crocus meadow", "kind": "bg", "energy": 0.3, "code": "const T = t * P.speed;\nconst e = P.energy;\nconst n1 = noise(x * 0.22 + 3, y * 0.22 + 7, T * 0.04);\nconst n2 = noise(x * 0.5 + 11, y * 0.5 + 2, T * 0.06 + 5);\nconst melt = 0.5 + 0.18 * gy": 0.3, "code": "const T = t * P.speed;\nconst e = P.energy;\nconst u = x / W, v = y / H;\nconst n1 = noise(x * 0.22 + T * 0.07, y * 0.22 - T * 0.05, T * 0.05);\nconst n2 = noise(x * 0.4 - T * 0.09, y * 0.4 + T * 0.06, 7 + T * 0.08);\nconst w1 = sin(x * 0.55 + y * 0.42 + T * 0.55 + n1 * 3.5);\nconst w2 = sin(-x * 0.38 + y * 0.6 - T * 0.4 + n2 * 4.0);\nconst wave = (w1 * 0.6 + w2 * 0.4) * 0.5 + 0.5;\nconst sandK = smoothstep(0.35, 0.75, n1 * 0.6 + wave * 0.5 + sin(x * 0.3 + y * 0.25 + T * 0.1) * 0.25);\nconst turq = mix([10, 90, 120], [30, 175, 170], wave);\nconst deep = mix([8, 55, 100], [70, 60, 140], n2);\nconst water = mix(deep, turq, smoothstep(0.2, 0.8, wave + n1 * 0.4));\nconst sand = mix([170, 120, 85], [215, 160, 110], n2);\nlet c = mix(water, sand, sandK * 0.8);\nconst foamLine = smoothstep(0.78, 0.97, wave) * (0.4 + 0.6 * smoothstep(0.3, 0.7, n2));\nconst foam = [215, 235, 230];\nc = mix(c, foam, foamLine * (0.45 + e * 0.6));\nconst glow = 0.5 + 0.5 * sin(T * 0.25 + n1 * 3 + (x + y) * 0.2);\nconst dawn = mix([235, 130, 110], [240, 165, 120], n2);\nconst dk = (0.16 + 0.18 * glow) * (0.6 + 0.4 * n1);\nc = mix(c, dawn, dk);\nc = [c[0] + 18 * glow, c[1] + 6 * glow, c[2] + 14 * glow];\nconst shade = 0.72 + 0.28 * smoothstep(0.1, 0.9, n1 + wave * 0.3);\nreturn clamp([c[0] * shade, c[1] * shade, c[2] * shade], 0, 185);\n"}, {"name": "snowstorm over the village", "kind": "bg", "energy": 0.45, "code": "const T = t * P.speed;\nconst e = P.energy;\nconst n1 = noise(x * 0.18 + T * 0.05, y * 0.18, T * 0.04);\nconst n2 = noise(x * 0.3 - T * 0.03, y * 0.3 + 7, T * 0.05 + 3);\nlet c = mix([14, 20, 62], [34, 30, 98], n1);\nc = mix(c, [58, 28, 92], n2 * 0.4);\nlet glow = 0;\nfor (let i = 0; i < 9; i++) {\n  const gx = hash(i * 3.1) * 16;\n  const gy = hash(i * 5.7 + 1) * 20;\n  const d = wrapd(x, y, gx, gy);\n  const fl = 0.78 + 0.22 * sin(T * (0.6 + hash(i) * 0.8) + i * 2.3);\n  glow += exp(-d * d / 2.2) * fl * (0.55 + 0.45 * hash(i * 9.3));\n}\nglow = min(glow, 1) * (0.5 + 0.4 * e);\nc = mix(c, [230, 120, 34], glow * 0.85);\nlet f = 0;\nfor (let i = 0; i < 22; i++) {\n  const sz = 0.7 + hash(i * 2.9 + 4) * 0.9;\n  const spd = (0.9 + hash(i * 1.7) * 0.9) * 0.9;\n  const px = hash(i * 7.3) * 16 + sin(T * 0.7 + i * 1.9) * 1.2;\n  const py = wrap(hash(i * 4.1 + 2) * 20 + T * spd, 20);\n  const dx = wrap(x - px + 8, 16) - 8;\n  const dy = wrap(y - py + 10, 20) - 10;\n  const d2 = dx * dx + dy * dy;\n  f += exp(-d2 / (sz * sz * 1.6)) * (0.6 + 0.4 * hash(i * 6.1));\n}\nf = min(f, 1) * (0.55 + 0.6 * e);\nconst drift = smoothstep(16.5, 19.5, y + noise(x * 0.35, T * 0.05, 5) * 2) * 0.35;\nc = mix(c, [190, 200, 236], clamp(drift, 0, 0.35));\nc = mix(c, [225, 232, 250], clamp(f, 0, 0.85));\nreturn clamp(c, 0, 235);\n"}, {"name": "last firefly goodnight", "kind": "moment", "energy": 0.15, "code": "const T = t * P.speed;\nconst u = clamp(t / P.dur, 0, 1);\nconst fx = wrap(3 + u * 10 + sin(T * 0.9) * 1.6 + sin(T * 0.37) * 1.1, W);\nconst fy = wrap(4 + u * 9 + cos(T * 0.7) * 2.2 + sin(T * 0.51) * 1.3, H);\nconst d = wrapd(x, y, fx, fy);\nconst b1 = exp(-pow((u - 0.18) / 0.075, 2));\nconst b2 = 0.62 * exp(-pow((u - 0.45) / 0.075, 2));\nconst b3 = 0.3 * exp(-pow((u - 0.72) / 0.075, 2));\nconst blink = (b1 + b2 + b3) * (0.75 + 0.25 * P.energy / 0.15);\nconst fade = smoothstep(0, 0.04, u) * smoothstep(1, 0.9, u);\nconst core = exp(-d * d / 1.6);\nconst halo = exp(-d * d / 7) * 0.45;\nconst tw = 0.9 + 0.1 * sin(T * 3 + x * 0.7 + y * 0.5);\nconst g = (core + halo) * blink * fade * tw;\nconst a = clamp(g * 1.15, 0, 1);\nconst c = mix([110, 200, 30], [215, 240, 90], clamp(core * blink, 0, 1));\nreturn [c[0], c[1], c[2], a];\n", "dur": 5}, {"name": "rainbow shooting star", "kind": "moment", "energy": 0.55, "code": "const T = t * P.speed;\nconst u = t / P.dur;\nconst prog = smoothstep(0.0, 0.78, u);\nconst hx = -3 + prog * 22;\nconst hy = 17 - prog * 14 - sin(prog * PI) * 5;\nconst dx = x - hx;\nconst dy = y - hy;\nconst along = -(dx * 0.85 - dy * 0.52);\nconst perp = dx * 0.52 + dy * 0.85;\nconst fadeIn = smoothstep(0.0, 0.1, u);\nconst fadeOut = 1 - smoothstep(0.72, 1.0, u);\nconst env = fadeIn * fadeOut;\nconst tailLen = 9 + P.energy * 7;\nconst tailFall = clamp(1 - along / tailLen, 0, 1);\nconst tailEnd = smoothstep(0, 0.12, along);\nconst wob = sin(along * 0.5 - T * 3) * 0.35;\nconst band = clamp((perp + wob) / 2.6 * 0.5 + 0.5, 0, 0.999);\nconst inside = smoothstep(0, 0.08, band) * smoothstep(1, 0.92, band);\nconst fadeTail = clamp(1 - (u - 0.35) * 1.6 + along / tailLen * 1.2, 0, 1);\nconst hue = band * 0.78;\nconst c = hsv(hue, 0.85, 1);\nconst ta = pow(tailFall, 1.3) * tailEnd * inside * env * fadeTail * (0.55 + P.energy * 0.45);\nconst hd = sqrt(dx * dx + dy * dy);\nconst glow = exp(-hd * hd / 3.2) * env;\nconst core = exp(-hd * hd / 0.9) * env;\nconst sp = 0.85 + 0.15 * sin(T * 9 + along);\nlet r = c[0] * 0.92 * ta;\nlet g = c[1] * 0.92 * ta;\nlet b = c[2] * 0.92 * ta;\nconst wa = clamp(glow * 0.7 + core * 0.6, 0, 1) * sp;\nconst a = clamp(ta + wa, 0, 1);\nif (a < 0.003) return [0, 0, 0, 0];\nconst k = ta / (ta + wa + 1e-6);\nconst wr = 235, wg = 235, wb = 250;\nreturn [mix(wr, c[0], k), mix(wg, c[1], k), mix(wb, c[2], k), a];\n", "dur": 3.5}, {"name": "koi pond fish", "kind": "loop", "energy": 0.25, "code": "const T = t * P.speed;\nlet r = 0, g = 0, b = 0, a = 0;\nfor (let i = 0; i < 3; i++) {\n  const s = 0.55 + i * 0.13 + hash(i + 7) * 0.1;\n  const ph = i * 2.1 + hash(i + 3) * 6;\n  const dir = i === 1 ? -1 : 1;\n  const hx = 8 + 6.5 * sin(T * 0.11 * s * dir + ph);\n  const hy = 10 + 8.5 * sin(T * 0.083 * s + ph * 1.7);\n  const ha = T * 0.11 * s * dir + ph;\n  const dx = cos(ha) * dir;\n  const dy = cos(T * 0.083 * s + ph * 1.7) * 0.8;\n  const len = sqrt(dx * dx + dy * dy) + 0.001;\n  const ux = dx / len, uy = dy / len;\n  const px = -uy, py = ux;\n  for (let k = 0; k < 7; k++) {\n    const u = k * 0.85;\n    const bend = sin(T * 0.9 * s - k * 0.7 + ph) * 0.35 * k * 0.5;\n    const cx = hx - ux * u + px * bend;\n    const cy = hy - uy * u + py * bend;\n    const d = wrapd(x, y, cx, cy);\n    const rad = 2.1 - k * 0.17;\n    const w = exp(-d * d / (rad * rad * 0.8));\n    if (w > 0.02) {\n      const sp = noise(k * 0.9 + i * 5, T * 0.05, i);\n      let c;\n      if (i === 0) c = mix([235, 225, 195], [225, 60, 35], smoothstep(0.35, 0.6, sp));\n      else if (i === 1) c = mix([230, 70, 40], [240, 190, 80], smoothstep(0.4, 0.65, sp));\n      else c = mix([240, 195, 90], [238, 228, 200], smoothstep(0.35, 0.6, sp));\n      const wt = w * (k === 6 ? 0.6 : 1) * (0.55 + 0.45 * P.energy * 2);\n      r += c[0] * wt; g += c[1] * wt; b += c[2] * wt;\n      a += wt * 0.85;\n    }\n  }\n}\na = clamp(a, 0, 0.9);\nconst m = max(1, a * 1.15);\nreturn [min(235, r / m), min(235, g / m), min(235, b / m), a];\n"}, {"name": "train across hot desert", "kind": "bg", "energy": 0.4, "code": "const T = t * P.speed;\nconst e = P.energy;\nconst wob = noise(x * 0.18, y * 0.18, T * 0.25);\nconst wob2 = noise(x * 0.12 + 7, y * 0.14 - 3, T * 0.18);\nconst u = x + (wob - 0.5) * 3.2;\nconst v = y + (wob2 - 0.5) * 3.2;\nconst d1 = sin(u * 0.42 + v * 0.22 - T * 0.5) * 0.5 + 0.5;\nconst d2 = sin(v * 0.35 - u * 0.2 + T * 0.35 + 2.0) * 0.5 + 0.5;\nconst d3 = noise(u * 0.25 + T * 0.12, v * 0.25, 4.0);\nconst k = clamp(d1 * 0.45 + d2 * 0.3 + d3 * 0.25, 0, 1);\nconst sand = mix([150, 62, 22], [214, 150, 58], smoothstep(0.15, 0.85, k));\nconst ember = mix([112, 36, 28], [176, 84, 30], d3);\nlet c = mix(ember, sand, smoothstep(0.25, 0.75, d1 * 0.6 + d3 * 0.4));\nconst sky = noise(x * 0.14 - T * 0.2, y * 0.14 + 11, T * 0.15);\nconst cobalt = mix([14, 44, 150], [32, 96, 205], sky);\nconst band = smoothstep(0.38, 0.62, noise(x * 0.1 + 20, y * 0.1 - T * 0.1, T * 0.2));\nc = mix(c, cobalt, band * 0.55);\nconst shim = sin((x + y) * 0.9 + T * 2.2 + wob * 6) * 0.5 + 0.5;\nconst glow = 0.1 + 0.12 * e * shim * smoothstep(0.35, 0.65, band * (1 - band) * 4);\nconst breathe = 0.9 + 0.1 * sin(T * 0.6 + wob * 3);\nc = mix(c, [236, 176, 96], glow);\nreturn [clamp(c[0] * breathe, 0, 188), clamp(c[1] * breathe, 0, 188), clamp(c[2] * breathe, 0, 200)];\n"}, {"name": "circus animal tent", "kind": "bg", "energy": 0.2, "code": "const T = t * P.speed;\nconst e = P.energy;\nconst n1 = noise(x * 0.18 + T * 0.05, y * 0.18 - T * 0.04, T * 0.07);\nconst n2 = noise(x * 0.35 - T * 0.06, y * 0.3 + T * 0.05, 7 + T * 0.09);\nlet base = mix([70, 38, 18], [150, 105, 40], n1);\nbase = mix(base, [118, 62, 30], smoothstep(0.45, 0.85, n2) * 0.55);\nlet gl = 0;\nfor (let i = 0; i < 14; i++) {\n  const bx = hash(i * 3.1) * W;\n  const by = hash(i * 7.7 + 1) * H;\n  const sx = bx + sin(T * 0.4 + i * 1.9) * 0.9;\n  const sy = by + cos(T * 0.33 + i * 2.3) * 0.7;\n  const d = wrapd(x, y, sx, sy);\n  const flick = 0.85 + 0.15 * sin(T * 1.3 + i * 5.1);\n  const sz = 1.6 + hash(i * 2.2) * 1.2;\n  gl += exp(-d * d / (sz * sz)) * flick * (0.55 + hash(i * 9.3) * 0.35);\n}\ngl = min(gl, 1) * (0.55 + e * 0.9);\nconst lantern = [235, 160, 55];\nlet c = [base[0] + lantern[0] * gl * 0.55, base[1] + lantern[1] * gl * 0.55, base[2] + lantern[2] * gl * 0.55];\nconst sh = noise(x * 0.12 + T * 0.07, y * 0.12 + 20 - T * 0.05, 40 + T * 0.04);\nconst shade = 1 - smoothstep(0.55, 0.8, sh) * 0.5;\nc = [c[0] * shade, c[1] * shade, c[2] * shade];\nconst breathe = 0.92 + 0.08 * sin(T * 0.5);\nreturn [min(c[0] * breathe, 200), min(c[1] * breathe, 175), min(c[2] * breathe, 110)];\n"}, {"name": "museum dinosaur hall night", "kind": "bg", "energy": 0.15, "code": "const T = t * P.speed;\nconst e = P.energy;\nconst n1 = noise(x * 0.16 + 3.1, y * 0.16 - T * 0.035, T * 0.05);\nconst n2 = noise(x * 0.3 - T * 0.03, y * 0.3 + 7.7, T * 0.04 + 5);\nlet base = mix([6, 12, 38], [14, 30, 74], n1);\nconst shaft = pow(max(0, sin((x + y * 0.55) * 0.62 + T * 0.1 + n1 * 2.2)), 3);\nconst moon = shaft * (0.45 + 0.55 * n2);\nlet r = base[0] + moon * 40;\nlet g = base[1] + moon * 62;\nlet b = base[2] + moon * 88;\nconst bone = pow(max(0, sin((x + 2.0 * n1) * 1.05 + T * 0.05)), 10) * pow(noise(x * 0.12 + 11, y * 0.45 + 2, 3 + T * 0.02), 1.5);\nconst ivory = bone * (0.3 + 0.7 * smoothstep(0.3, 0.7, n2)) * (0.5 + 0.3 * e * 3);\nr += ivory * 62;\ng += ivory * 72;\nb += ivory * 70;\nconst dx = wrapd(x, y, 7.5, 18.5);\nconst breathe = 0.82 + 0.18 * sin(T * 0.6);\nconst amb = exp(-dx * dx * 0.045) * breathe;\nr += amb * 150;\ng += amb * 68;\nb += amb * 8;\nconst gl = noise(x * 0.5 + 20, y * 0.5 + 9, T * 0.12);\nconst star = max(0, gl - 0.78) * 4;\nconst tw = 0.5 + 0.5 * sin(T * 0.8 + hash(x * 31 + y * 17) * 6.28);\nb += star * tw * 40 * (0.5 + e);\ng += star * tw * 28 * (0.5 + e);\nr += star * tw * 14 * (0.5 + e);\nreturn [clamp(r, 0, 190), clamp(g, 0, 190), clamp(b, 0, 190)];\n"}];
