<h1>Lully scene samples</h1><p>39 test paintings by Claude Sonnet, running live. B = background, L = ongoing overlay, M = one-time moment (replays). Overlays are shown over a plain night-blue background. Tap any tile for full screen.</p>

<script>
const W=16,H=20,PI=Math.PI,{sin,cos,tan,abs,floor,min,max,sqrt,pow,exp,atan2,round}=Math;
const wrap=(v,n)=>((v%n)+n)%n;
const hash=n=>{const s=Math.sin(n*127.1+311.7)*43758.5453;return s-Math.floor(s)};
const h3=(x,y,z)=>hash(x*157+y*113+z*271);
const sm=t=>t*t*(3-2*t);
function noise(x,y,z){const X=floor(x),Y=floor(y),Z=floor(z),fx=sm(x-X),fy=sm(y-Y),fz=sm(z-Z);const L=(a,b,t)=>a+(b-a)*t;
 return L(L(L(h3(X,Y,Z),h3(X+1,Y,Z),fx),L(h3(X,Y+1,Z),h3(X+1,Y+1,Z),fx),fy),L(L(h3(X,Y,Z+1),h3(X+1,Y,Z+1),fx),L(h3(X,Y+1,Z+1),h3(X+1,Y+1,Z+1),fx),fy),fz)}
function hsv(h,s,v){h=((h%1)+1)%1;const i=floor(h*6),f=h*6-i,p=v*(1-s),q=v*(1-f*s),u=v*(1-(1-f)*s);const c=[[v,u,p],[q,v,p],[p,v,u],[p,q,v],[u,p,v],[v,p,q]][i%6];return c.map(k=>k*255)}
const clamp=(v,a,b)=>Array.isArray(v)?v.map(q=>q<a?a:q>b?b:q):v<a?a:v>b?b:v;
const mix=(a,b,k)=>typeof a==='number'?a+(b-a)*k:[a[0]+(b[0]-a[0])*k,a[1]+(b[1]-a[1])*k,a[2]+(b[2]-a[2])*k];
const smoothstep=(e0,e1,v)=>{const q=clamp((v-e0)/(e1-e0),0,1);return q*q*(3-2*q)};
const fract=v=>v-Math.floor(v);
function wrapd(ax,ay,bx,by){let dx=abs(ax-bx)%W,dy=abs(ay-by)%H;dx=min(dx,W-dx);dy=min(dy,H-dy);return sqrt(dx*dx+dy*dy)}

const ITEMS=[{"name": "police car chase", "kind": "loop", "energy": 0.9, "code": "const T = t * P.speed;\nconst e = P.energy;\nlet r = 0, g = 0, b = 0, a = 0;\nconst hx = wrap(T * 5.5 + 3 * sin(T * 1.7), W);\nconst hy = wrap(T * 3.1 + 4 * sin(T * 2.3 + 1), H);\nconst hd = wrapd(x, y, hx, hy);\nconst hg = exp(-hd * hd / 3.2);\nconst hv = hg * 150;\nr += hv; g += hv; b += hv * 0.9;\na = max(a, hg * 0.55);\nconst n = 2 + (e > 0.55 ? 1 : 0);\nfor (let i = 0; i < n; i++) {\n  for (let k = 0; k < 7; k++) {\n    const tt = T - k * 0.055;\n    const sp = 4.6 + i * 0.5;\n    const cx = wrap(tt * sp - 7 - i * 5 + 3.2 * sin(tt * (3.1 + i)), W);\n    const cy = wrap(tt * (2.9 + i * 0.4) - 6 - i * 4 + 4.5 * sin(tt * (2.3 + i * 0.7) + i * 2), H);\n    const phase = floor(tt * 6 + i * 0.5);\n    for (let s = 0; s < 2; s++) {\n      const px = wrap(cx + (s ? 1.5 : -1.5), W);\n      const d = wrapd(x, y, px, cy);\n      const isRed = (phase + s) % 2 === 0;\n      const fl = 0.55 + 0.45 * abs(sin(tt * 18 + s * PI));\n      const tail = exp(-k * 0.55);\n      const gl = exp(-d * d / (k === 0 ? 2.4 : 1.6)) * tail * fl * (0.6 + 0.4 * e);\n      const cr = isRed ? 255 : 20;\n      const cg = isRed ? 15 : 70;\n      const cb = isRed ? 40 : 255;\n      r += cr * gl; g += cg * gl; b += cb * gl;\n      a = max(a, gl);\n    }\n  }\n}\nconst o = clamp(a * 1.25, 0, 1);\nreturn [min(255, r), min(255, g), min(255, b), o];\n"}, {"name": "ambulance speeding past", "kind": "moment", "energy": 0.8, "code": "const T = t * P.speed;\nconst u = clamp(t / P.dur, 0, 1);\nconst e = P.energy;\nconst env = smoothstep(0, 0.12, u) * (1 - smoothstep(0.78, 1, u));\nconst hx = 19 - u * 40;\nconst dx = x - hx;\nconst yw = y + sin(T * 2.2 + x * 0.25) * 1.2;\nconst cy = 9.5 + sin(u * 3) * 2.5;\nconst dy = (yw - cy) / 7;\nconst band = exp(-dy * dy);\nconst beat = floor(T * 6.5);\nconst ph = fract(T * 6.5);\nconst sideA = beat % 2 === 0 ? 1 : 0;\nconst pulse = 0.45 + 0.55 * smoothstep(0, 0.15, ph) * (1 - smoothstep(0.55, 0.95, ph));\nconst lead = exp(-dx * dx / 3.5);\nconst gx = dx > 0 ? dx : -dx;\nconst trail = dx < 0 ? exp(dx / (4 + 3 * e)) : 0;\nconst lane = (y % 2 === 0) ? sideA : 1 - sideA;\nconst flash = lane * pulse;\nconst redk = trail * band * (0.35 + 0.65 * flash);\nconst whitek = lead * band * (0.5 + 0.5 * pulse);\nconst halo = exp(-gx * gx / 40) * band * 0.45;\nconst sh = 0.85 + 0.15 * noise(x * 0.5 + T * 3, y * 0.5, 7);\nlet r = 255 * redk * sh + 205 * whitek + 150 * halo;\nlet g = 25 * redk + 195 * whitek + 20 * halo + 70 * trail * band * 0.3;\nlet b = 45 * redk + 215 * whitek + 70 * halo + 95 * trail * band * 0.35;\nconst a = clamp((redk * 0.85 + whitek + halo * 0.6) * env * (0.55 + 0.45 * e), 0, 1);\nreturn [clamp(r, 0, 255), clamp(g, 0, 235), clamp(b, 0, 240), a];\n", "dur": 3.5}, {"name": "inside the volcano crater", "kind": "bg", "energy": 0.45, "code": "const T = t * P.speed;\nconst e = P.energy;\nconst cx = x - 7.5, cy = y - 9.5;\nconst r = sqrt(cx * cx + cy * cy);\nconst ang = atan2(cy, cx);\nconst n1 = noise(cx * 0.35 + T * 0.15, cy * 0.35 - T * 0.12, T * 0.2);\nconst n2 = noise(cx * 0.9 - T * 0.25, cy * 0.9 + T * 0.2, 5 + T * 0.3);\nconst ridge = 1 - abs(n2 * 2 - 1);\nconst lava = clamp(0.35 + 0.6 * n1 + 0.5 * pow(ridge, 3) * (0.5 + e) - r * 0.04, 0, 1);\nconst hot = hsv(0.02 + 0.09 * lava, 1, 0.35 + 0.6 * lava);\nconst wallBase = [28 + 20 * n1, 8 + 6 * n2, 36 + 22 * n1];\nconst flick = 0.5 + 0.5 * sin(T * 3.1 + ang * 3 + n2 * 6);\nconst glowK = clamp((r - 5) / 5, 0, 1) * (0.25 + 0.3 * e) * (0.6 + 0.4 * flick) * (0.5 + n1);\nconst wallLit = mix(wallBase, [200, 70, 20], clamp(glowK + 0.08, 0, 1));\nconst wallK = smoothstep(4.5, 8.5, r + (n1 - 0.5) * 3);\nlet c = mix(hot, wallLit, wallK);\nconst sky = 1 - smoothstep(1.5, 4.5, r);\nconst tw = hash(floor(x) * 31 + floor(y) * 17);\nconst star = pow(max(0, sin(T * (0.8 + tw) + tw * 40)), 6) * (tw > 0.7 ? 1 : 0);\nconst skyC = [20 + 25 * n2 + 150 * star, 18 + 20 * n1 + 130 * star, 90 + 50 * n1 + 100 * star];\nconst skyMask = smoothstep(7.5, 4.5, abs(cx) * 0.9 + abs(cy + 7) * 0.6 + 0.2) * (1 - smoothstep(0, 5, r - 8));\nconst hole = clamp(skyMask * smoothstep(8, 6.5, r) * 0.85, 0, 1);\nc = mix(c, skyC, hole);\nreturn [clamp(c[0], 0, 215), clamp(c[1], 0, 190), clamp(c[2], 0, 190)];\n"}, {"name": "laser eye beams", "kind": "moment", "energy": 0.85, "code": "const T = t * P.speed;\nconst u = t / P.dur;\nconst E = P.energy;\nconst fadeAll = 1 - smoothstep(0.78, 1.0, u);\nconst ign = smoothstep(0.0, 0.1, u);\nconst shoot = smoothstep(0.12, 0.22, u);\nconst reach = shoot * 20;\nlet r = 0, g = 0, b = 0, a = 0;\nfor (let i = 0; i < 2; i++) {\n  const bx = 5.5 + i * 5;\n  const dx = abs(x - bx - sin(T * 3 + y * 0.5 + i) * 0.15);\n  const along = y;\n  const inLen = along < reach ? 1 : 0;\n  const flick = 0.75 + 0.25 * noise(i * 9, along * 0.4 - T * 14, T * 3);\n  const core = exp(-dx * dx * 3.5) * inLen * flick;\n  const glow = exp(-dx * dx * 0.5) * inLen * 0.55 * flick;\n  const tip = exp(-pow(along - reach, 2) * 0.5) * shoot * (1 - smoothstep(0.2, 0.3, u)) * exp(-dx * dx);\n  const dot = exp(-(dx * dx + along * along) * 0.6) * ign * (1 - shoot * 0.5);\n  const hot = clamp(core * 0.9 + tip + dot, 0, 1);\n  const s = clamp(glow + core + dot + tip, 0, 1);\n  r += 230 * glow + 120 * core + 150 * hot;\n  g += 20 * glow + 90 * core * core + 190 * hot * hot * hot;\n  b += 25 * glow + 70 * hot * hot * hot;\n  a = max(a, s);\n}\nconst sx = 8, sy = 18;\nconst d2 = (x - sx) * (x - sx) + (y - sy) * (y - sy) * 0.6;\nconst grow = smoothstep(0.2, 0.55, u);\nconst scorch = exp(-d2 / (3 + 6 * grow)) * grow * (0.7 + 0.3 * noise(x * 0.8, y * 0.8, T * 5));\nr += 255 * scorch;\ng += (90 + 40 * noise(x, y, T * 4)) * scorch;\nb += 8 * scorch;\na = clamp(max(a, scorch * 0.9), 0, 1) * fadeAll * (0.55 + 0.45 * E);\nreturn [clamp(r, 0, 255), clamp(g, 0, 255), clamp(b, 0, 255), a];\n", "dur": 2.5}, {"name": "snowmelt crocus meadow", "kind": "bg", "energy": 0.3, "code": "const T = t * P.speed;\nconst e = P.energy;\nconst n1 = noise(x * 0.22 + 3.1, y * 0.22 + 1.7, T * 0.05);\nconst n2 = noise(x * 0.6 + 9, y * 0.6 + 4, T * 0.08);\nconst melt = 0.62 - 0.08 * sin(T * 0.12);\nconst snowAmt = smoothstep(melt - 0.1, melt + 0.1, n1 * 0.8 + n2 * 0.25);\nconst sky = [110, 170, 225];\nconst skyShim = 0.85 + 0.15 * sin(T * 0.4 + x * 0.3 + y * 0.2);\nconst grassBase = mix([30, 130, 55], [90, 175, 70], n2);\nconst grassShade = 0.8 + 0.2 * noise(x * 1.3, y * 1.3, T * 0.15);\nconst grass = [grassBase[0] * grassShade, grassBase[1] * grassShade, grassBase[2] * grassShade];\nconst snow = [\n  185 + 15 * n2 + 10 * sin(T * 0.7 + x),\n  205 + 12 * n2,\n  235 + 10 * sin(T * 0.5 + y)\n];\nlet c = mix(grass, snow, snowAmt);\nconst skyK = 0.22 * (0.5 + 0.5 * noise(x * 0.15 + 20, y * 0.15, T * 0.1));\nc = mix(c, [sky[0] * skyShim, sky[1] * skyShim, sky[2] * skyShim], skyK);\nconst cx = floor(x), cy = floor(y);\nconst id = cx * 31 + cy * 7;\nconst h = hash(id);\nconst showing = h < 0.18 + 0.25 * e;\nconst period = 9 + h * 10;\nconst ph = fract((T + h * 40) / period);\nconst grow = smoothstep(0.0, 0.12, ph) * (1 - smoothstep(0.8, 0.98, ph));\nconst bareOK = 1 - smoothstep(0.35, 0.6, snowAmt);\nconst kind = hash(id + 5);\nconst flower = kind < 0.5 ? [160, 70, 235] : kind < 0.78 ? [235, 200, 50] : [225, 225, 235];\nconst pulse = 0.85 + 0.15 * sin(T * 1.5 + h * 20);\nconst k = showing ? grow * bareOK * pulse : 0;\nconst dx = x - cx - 0.5, dy = y - cy - 0.5;\nconst glow = exp(-(dx * dx + dy * dy) * 6) * k;\nc = mix(c, flower, clamp(glow * 0.95, 0, 1));\nreturn [clamp(c[0], 0, 235), clamp(c[1], 0, 235), clamp(c[2], 0, 240)];\n"}, {"name": "fluffy clouds drifting", "kind": "loop", "energy": 0.2, "code": "const T = t * P.speed;\nconst e = P.energy;\nlet dens = 0;\nlet sh = 0;\nconst n = 3 + (e > 0.5 ? 1 : 0);\nfor (let i = 0; i < 4; i++) {\n  if (i >= n) break;\n  const sp = 0.35 + hash(i * 7.1) * 0.3;\n  const cx = wrap(hash(i * 3.3) * W + T * sp, W);\n  const cy = 2 + hash(i * 5.7) * (H - 4) + sin(T * 0.2 + i * 2.0) * 1.2;\n  const sw = 1 + 0.18 * sin(T * 0.5 + i * 1.7);\n  const rx = (3.2 + hash(i * 9.1) * 1.8) * sw;\n  const ry = (2.2 + hash(i * 2.9) * 1.2) * sw;\n  for (let j = 0; j < 3; j++) {\n    const ox = (j - 1) * rx * 0.55;\n    const oy = (j === 1 ? -0.4 : 0.3) * ry;\n    let dx = abs(x - cx - ox);\n    dx = min(dx, W - dx);\n    const dy = y - cy - oy;\n    const d = sqrt((dx * dx) / (rx * rx * 0.45) + (dy * dy) / (ry * ry * 0.8));\n    const m = smoothstep(1.0, 0.25, d);\n    dens = max(dens, m);\n    sh = max(sh, m * smoothstep(-1.5, 2.0, dy));\n  }\n}\nconst tex = 0.85 + 0.15 * noise(x * 0.4 - T * 0.2, y * 0.4, T * 0.15);\nconst a = clamp(dens * (0.55 + e * 0.9) * tex, 0, 0.95);\nconst top = [235, 235, 250];\nconst under = [190, 150, 235];\nconst c = mix(top, under, clamp(sh * 0.85, 0, 1));\nreturn [c[0] * tex, c[1] * tex, c[2] * tex, a];\n"}, {"name": "flock of birds flying", "kind": "loop", "energy": 0.5, "code": "const T = t * P.speed;\nconst e = P.energy;\nconst n = 6 + floor(e * 26);\nconst dx = 0.7071, dy = 0.7071;\nlet a = 0, r = 0, g = 0, b = 0, w = 0;\nconst sw = 0.5 + 0.5 * sin(T * 0.35);\nfor (let i = 0; i < n; i++) {\n  const h1 = hash(i * 3.1 + 1), h2 = hash(i * 5.7 + 2), h3 = hash(i * 7.3 + 3);\n  const along = (T * (1.1 + h3 * 0.5) + h1 * 40) % 40 - 12;\n  const side = (h2 - 0.5) * (7 + 5 * sw) + 2.2 * sin(T * 0.6 + h1 * 6.28) + 1.5 * sin(T * 1.3 + i);\n  const cx = 8 + along * dx - side * dy + 1.5 * sin(T * 0.5 + h2 * 6.28);\n  const cy = 10 + along * dy + side * dx + 1.5 * cos(T * 0.45 + h1 * 6.28);\n  const d = wrapd(x, y, cx, cy);\n  const s = exp(-d * d * 1.6);\n  if (s < 0.02) continue;\n  const flick = sin(T * (9 + h3 * 5) + h1 * 20);\n  const blink = smoothstep(0.85, 1, flick);\n  const k = s * (0.65 + 0.35 * h3);\n  const hue = 0.58 + h2 * 0.1;\n  const c = hsv(hue, 0.55 + 0.3 * h1, 0.55 + 0.4 * h3);\n  const body = mix([30, 40, 80], c, h2);\n  r += body[0] * k; g += body[1] * k; b += body[2] * k;\n  w += blink * s;\n  a += k;\n}\na = clamp(a, 0, 1);\nconst ww = clamp(w, 0, 1);\nconst al = clamp(a * (0.75 + 0.5 * e) + ww * 0.5, 0, 1);\nconst inv = a > 0.001 ? 1 / a : 0;\nconst R = clamp(r * inv * 1.5 + ww * 255, 0, 255);\nconst G = clamp(g * inv * 1.5 + ww * 255, 0, 255);\nconst B = clamp(b * inv * 1.5 + 70 + ww * 255, 0, 255);\nreturn [R, G, B, al];\n"}, {"name": "wand lightning bolt", "kind": "moment", "energy": 0.9, "code": "const T = t * P.speed;\nconst e = P.energy;\nconst d = P.dur;\nconst u = t / d;\nconst ang = 0.55;\nconst ca = cos(ang), sa = sin(ang);\nconst px = x - 7.5, py = y - 9.5;\nconst along = px * ca + py * sa;\nconst across = -px * sa + py * ca;\nconst wob = (noise(along * 0.5, 3.1, 0) - 0.5) * 7 + (noise(along * 1.3, 7.7, 1) - 0.5) * 2.5;\nconst dist = abs(across - wob);\nconst core = exp(-dist * dist * 1.6);\nconst halo = exp(-dist * dist * 0.12);\nconst br1 = smoothstep(0.0, 0.02, u) * (1 - smoothstep(0.1, 0.17, u));\nconst br2 = smoothstep(0.22, 0.24, u) * (1 - smoothstep(0.28, 0.34, u)) * 0.85;\nconst br3 = smoothstep(0.4, 0.42, u) * (1 - smoothstep(0.46, 0.54, u)) * 0.7;\nconst flash = max(br1, br2, br3);\nconst after = smoothstep(0.34, 0.5, u) * (1 - smoothstep(0.6, 1, u));\nconst buzz = 0.55 + 0.45 * sin(T * 40 + along * 1.7 + hash(floor(along * 2)) * 6);\nconst branchN = noise(x * 0.6 + 5, y * 0.6, floor(t * 14) * 0.7);\nconst branch = smoothstep(0.62, 0.8, branchN) * halo * flash * e;\nconst aGlow = after * buzz * exp(-dist * dist * 0.35) * (0.55 + 0.45 * e);\nconst wc = flash * core;\nconst hc = flash * halo * 0.55 * e;\nconst r = 150 * hc + 255 * wc + 60 * branch * 2 + 150 * aGlow;\nconst g = 40 * hc + 235 * wc + 30 * branch + 30 * aGlow;\nconst b = 255 * hc + 255 * wc + 255 * branch + 255 * aGlow;\nconst a = clamp(max(wc, hc * 1.3, branch, aGlow * 0.8) * (1 - smoothstep(0.93, 1, u)), 0, 1);\nreturn [clamp(r, 0, 255), clamp(g, 0, 255), clamp(b, 0, 255), a];\n", "dur": 1.5}, {"name": "fireplace embers settling", "kind": "moment", "energy": 0.15, "code": "const T = t * P.speed;\nconst e = P.energy;\nconst u = T / (P.speed * P.dur);\nconst env = smoothstep(0, 0.12, u) * (1 - smoothstep(0.82, 1, u));\nconst fl = 1 - smoothstep(0.15, 0.7, u);\nconst n1 = noise(x * 0.5, y * 0.35 - T * 1.4, 3);\nconst n2 = noise(x * 0.9 + 7, y * 0.6 - T * 2.2, 9);\nconst sh = 0.5 + 0.2 * (y / 19);\nconst flame = clamp((n1 * 0.6 + n2 * 0.4) * 1.5 - (1 - sh) * 0.9 - 0.1, 0, 1) * fl * (0.55 + e);\nconst pulse = 0.5 + 0.5 * sin(T * 1.3 + noise(x * 0.4, y * 0.4, 5) * 9 + hash(x * 7 + y * 13) * 2);\nconst ember = (0.25 + 0.55 * pulse) * (0.35 + 0.65 * noise(x * 0.7, y * 0.7 + 4, T * 0.4)) * smoothstep(0.1, 0.5, u) * (0.6 + e * 0.8);\nconst eCol = hsv(0.01 + 0.03 * pulse, 1, 0.8 * ember);\nconst fCol = hsv(0.04 + 0.08 * flame, 1, clamp(flame * 1.1, 0, 0.85));\nlet r = eCol[0] + fCol[0], g = eCol[1] + fCol[1], b = eCol[2] + fCol[2] * 0.3;\nlet a = clamp((ember * 1.4 + flame * 1.3) * env, 0, 1);\nfor (let i = 0; i < 6; i++) {\n  const sp = 0.5 + hash(i * 3.1) * 0.5;\n  const ph = fract(T * 0.25 * sp + hash(i + 11));\n  const sx = wrap(hash(i * 5.7) * 16 + sin(T * 0.8 + i * 2) * 1.2, 16);\n  const sy = wrap(14 - ph * 12, 20);\n  const d = wrapd(x, y, sx, sy);\n  const k = exp(-d * d * 1.6) * (1 - ph) * min(1, ph * 6) * smoothstep(0.1, 0.4, e + 0.2) * env;\n  r += 255 * k; g += 150 * k; b += 40 * k;\n  a = max(a, k);\n}\nreturn [clamp(r, 0, 235), clamp(g, 0, 160), clamp(b, 0, 70), clamp(a, 0, 1)];\n", "dur": 7}, {"name": "christmas tree lights", "kind": "loop", "energy": 0.4, "code": "const T = t * P.speed;\nconst E = P.energy;\nconst cx = 7.5, cy = 9.5;\nconst dx = x - cx, dy = y - cy;\nconst ang = atan2(dy, dx);\nconst rad = sqrt(dx * dx + dy * dy);\nlet r = 0, g = 0, b = 0, a = 0;\nconst glow = 0.5 + 0.5 * noise(x * 0.4, y * 0.4, T * 0.3);\nconst fieldA = smoothstep(11, 2, rad) * 0.5;\nr = 10 * glow; g = (60 + 50 * glow); b = 30 * glow;\na = fieldA;\nconst sp = fract(ang / (2 * PI) + rad * 0.16 - T * 0.05);\nconst band = smoothstep(0.22, 0.0, abs(sp
